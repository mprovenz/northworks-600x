# =============================================================================
#  Speed-envelope testing — no filament, no heat (2026-08-14).
#  Adapted from AndrewEllis93's TEST_SPEED for the Northworks 600x.
#
#  METHOD: home XY -> record raw MCU step counters (GET_POSITION) -> hammer a
#  diagonal-heavy pattern at the requested speed/accel -> re-home -> record
#  again. If the per-stepper counters differ by more than ~a fullstep
#  (16 microsteps here, ~0.17 mm), steps were lost at that setting.
#  Diagonals matter most: on CoreXY they drive ONE motor at speed x sqrt(2) —
#  exactly the overrun that caused the 2026-08 layer-shift failure.
#
#  USAGE (bed dropped ~50 mm first so nothing is over it):
#    G28
#    G91
#    G1 Z50 F198
#    G90
#    TEST_SPEED SPEED=133 ACCEL=1000 ITERATIONS=3     <- vendor-proven baseline
#  then ladder upward, one variable at a time:
#    TEST_SPEED SPEED=175 ITERATIONS=5
#    TEST_SPEED SPEED=200 ITERATIONS=5
#    TEST_SPEED SPEED=225 ITERATIONS=5 ...
#    TEST_SPEED SPEED=200 ACCEL=2000 ITERATIONS=5 ...
#
#  READING THE RESULT: compare the two GET_POSITION console blocks —
#  the "mcu: stepper_x:N stepper_y:N" lines. Drift of a few microsteps is
#  homing repeatability; drift >= 16 microsteps on either stepper = FAIL at
#  that setting. Back off, or raise current and retest:
#    SET_TMC_CURRENT STEPPER=stepper_x CURRENT=1.2   (and stepper_y —
#    verified-intent headroom exists up to 1.77 A RMS; watch motor temps)
#
#  Set real limits to ~80% of the highest clean setting. Because the pattern
#  is diagonal-heavy, a clean pass at SPEED=S certifies max_velocity: S for
#  ALL moves including diagonals.
#
#  Z IS EXEMPT: the lead screw is mechanically capped at 3.3 mm/s and cannot
#  meaningfully skip at print loads; mesh-follow moves are micrometres.
# =============================================================================

[gcode_macro TEST_SPEED]
description: Materialless XY speed test.  TEST_SPEED SPEED= ACCEL= ITERATIONS= [BOUND=] [SMALLPATTERNSIZE=]
gcode:
    {% set speed = params.SPEED|default(printer.configfile.settings.printer.max_velocity)|int %}
    {% set iterations = params.ITERATIONS|default(5)|int %}
    {% set accel = params.ACCEL|default(printer.configfile.settings.printer.max_accel)|int %}
    {% set bound = params.BOUND|default(30)|int %}
    {% set smallpatternsize = params.SMALLPATTERNSIZE|default(20)|int %}

    {% set x_min = printer.toolhead.axis_minimum.x + bound %}
    {% set x_max = printer.toolhead.axis_maximum.x - bound %}
    {% set y_min = printer.toolhead.axis_minimum.y + bound %}
    {% set y_max = printer.toolhead.axis_maximum.y - bound %}
    {% set x_center = (printer.toolhead.axis_minimum.x + printer.toolhead.axis_maximum.x) / 2 %}
    {% set y_center = (printer.toolhead.axis_minimum.y + printer.toolhead.axis_maximum.y) / 2 %}
    {% set small_x_min = x_center - smallpatternsize / 2 %}
    {% set small_x_max = x_center + smallpatternsize / 2 %}
    {% set small_y_min = y_center - smallpatternsize / 2 %}
    {% set small_y_max = y_center + smallpatternsize / 2 %}

    RESPOND MSG="TEST_SPEED: {iterations} iterations at {speed} mm/s, accel {accel} (diagonal motor rate ~{(speed * 1.414)|int} mm/s)"
    SAVE_GCODE_STATE NAME=test_speed
    G28 X Y
    G4 P1000
    GET_POSITION                    ; <- BEFORE snapshot (mcu: stepper counts)

    SET_VELOCITY_LIMIT VELOCITY={speed} ACCEL={accel}
    G90
    {% for i in range(iterations) %}
        ; large pattern: diagonals (the CoreXY stressor)
        G0 X{x_min} Y{y_min} F{speed * 60}
        G0 X{x_max} Y{y_max} F{speed * 60}
        G0 X{x_min} Y{y_min} F{speed * 60}
        G0 X{x_max} Y{y_min} F{speed * 60}
        G0 X{x_min} Y{y_max} F{speed * 60}
        G0 X{x_max} Y{y_min} F{speed * 60}
        ; large pattern: box (single-axis sweeps)
        G0 X{x_min} Y{y_min} F{speed * 60}
        G0 X{x_min} Y{y_max} F{speed * 60}
        G0 X{x_max} Y{y_max} F{speed * 60}
        G0 X{x_max} Y{y_min} F{speed * 60}
        ; small pattern at centre: rapid direction reversals (accel stressor)
        G0 X{small_x_min} Y{small_y_min} F{speed * 60}
        G0 X{small_x_max} Y{small_y_max} F{speed * 60}
        G0 X{small_x_min} Y{small_y_min} F{speed * 60}
        G0 X{small_x_max} Y{small_y_min} F{speed * 60}
        G0 X{small_x_min} Y{small_y_max} F{speed * 60}
        G0 X{small_x_max} Y{small_y_min} F{speed * 60}
        G0 X{small_x_min} Y{small_y_min} F{speed * 60}
        G0 X{small_x_min} Y{small_y_max} F{speed * 60}
        G0 X{small_x_max} Y{small_y_max} F{speed * 60}
        G0 X{small_x_max} Y{small_y_min} F{speed * 60}
    {% endfor %}

    SET_VELOCITY_LIMIT VELOCITY={printer.configfile.settings.printer.max_velocity} ACCEL={printer.configfile.settings.printer.max_accel}
    G28 X Y
    G4 P1000
    GET_POSITION                    ; <- AFTER snapshot: compare stepper counts
    RESTORE_GCODE_STATE NAME=test_speed
    RESPOND MSG="TEST_SPEED done — compare the two GET_POSITION 'mcu:' lines; >=16 microsteps drift on a stepper = lost steps at this setting"
