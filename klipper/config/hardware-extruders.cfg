# =============================================================================
#  Extruders — stepper AND heater together.
#
#  Klipper's [extruder] section owns both the motor and the hotend, so it cannot
#  be split across stage files: the config is invalid until the heater keys are
#  present. This file is therefore ALWAYS included, even during stage-1 motion
#  bring-up — "stage 1" means do not COMMAND heat, not that heat is undefined.
#
#  ⚠ DO NOT COPY THE SMOOTHIEWARE PID VALUES. Klipper's PID scaling differs.
#     Run PID_CALIBRATE per heater, then SAVE_CONFIG.
# =============================================================================

# ---------- E0 (delta) — expansion slot ---------------------------------------
[extruder]
step_pin: P2.8
dir_pin: !P2.13                     #!! VERIFY at first filament load — applied by the confirmed
                                    #   rule "Klipper polarity = opposite of the Smoothieware
                                    #   marking" (vendor had 2.13 plain). If LOAD_FILAMENT
                                    #   retracts instead of feeding, remove the '!'.
microsteps: 32
rotation_distance: 6.8522           # 934 steps/mm — implies a geared extruder
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: P2.4
sensor_type: PT1000                 # IDENTIFIED at first Klipper boot (2026-08-13): under the
                                    #   vendor's "beta 4066" config both hotends read 172.8 C at
                                    #   ~23 C ambient -> implied resistance 1088 ohm = PT1000 at
                                    #   room temp, exactly. The config's beta 4066 was vestigial
                                    #   (the vendor fork evidently handled PT1000 in code), and
                                    #   it also explains the firmware's 500 C hotend max_temp.
pullup_resistor: 4700
sensor_pin: P0.24
# control + pid gains -> printer.cfg autosave, set by PID_CALIBRATE.
# Klipper forbids autosaved options in included files (learned 2026-08-14).
# PLACEHOLDERS — replace via: PID_CALIBRATE HEATER=extruder TARGET=220
#pid_Kp: 22.2
#pid_Ki: 1.08
#pid_Kd: 114
min_temp: 0
max_temp: 300                       # firmware allows 500; 300 is a sane guard
min_extrude_temp: 170
max_extrude_only_distance: 150      # the load/unload macros push a long way
pressure_advance: 0.0               # tune later — Smoothieware had no equivalent

[tmc2660 extruder]
cs_pin: P4.29
spi_bus: ssp0                       # CONFIRMED (SSP0)
sense_resistor: 0.100               # CONFIRMED R100 — the only drivers the vendor configured
                                    #   with the correct shunt value
run_current: 0.58                   # replicates the actual historical current: Smoothieware's
                                    #   800 mA is PEAK (CS 15 on 0.1 Ohm = 0.825 A peak
                                    #   = 0.58 A RMS); Klipper run_current is RMS. 0.8 here
                                    #   would push ~40% more heat into the extruder motor.
interpolate: False                  # INTPOL is inert at 32 usteps (16-ustep-only feature)

# ---------- E1 (epsilon) — drives the board's X slot --------------------------
[extruder1]
step_pin: P2.0
dir_pin: P0.5                       #!! VERIFY at first T1 filament load — same rule as E0
                                    #   (vendor had 0.5!)
microsteps: 32
rotation_distance: 6.8522
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: P2.5
sensor_type: PT1000                 # see [extruder] — identified from the 172.8 C ambient read
pullup_resistor: 4700
sensor_pin: P0.25
# control + pid gains -> printer.cfg autosave, set by PID_CALIBRATE.
# Klipper forbids autosaved options in included files (learned 2026-08-14).
# PID_CALIBRATE HEATER=extruder1 TARGET=220
# NB: the machine's stored gains for T1 are the BED's and are wrong. There is
# nothing to carry over even if the scaling did match.
#pid_Kp: 22.2
#pid_Ki: 1.08
#pid_Kd: 114
min_temp: 0
max_temp: 300
min_extrude_temp: 170
max_extrude_only_distance: 150
pressure_advance: 0.0
# The tool offset (M675.1 X-52.25) is applied by the T1 macro via
# SET_GCODE_OFFSET, not here and not by the slicer. Keep slicer offsets at 0.

[tmc2660 extruder1]
cs_pin: P0.4                        # X slot EN
spi_bus: ssp0
sense_resistor: 0.100               # CONFIRMED R100
run_current: 0.58                   # see [tmc2660 extruder]
interpolate: False                  # INTPOL is inert at 32 usteps
