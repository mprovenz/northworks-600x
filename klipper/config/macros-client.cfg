# =============================================================================
#  ALWAYS INCLUDED — client-facing macros Fluidd/Mainsail require to exist:
#  PAUSE / RESUME / CANCEL_PRINT (plus PARK, which they use).
#
#  Unlike the stage-6 print macros, everything here is HARDWARE-AGNOSTIC and
#  safe in every bring-up stage:
#    * extruder moves only happen if the nozzle is hot (can_extrude)
#    * Z/XY moves only happen if the axes are homed
#    * Z lifts are clamped to the remaining travel
#    * CABINET_OFF is called only if stage 5 defines it
#  Mirrors OctoPrint's afterPrintPaused / beforePrintResumed scripts, which
#  retracted 5 mm, lifted Z and parked with G28.2.
# =============================================================================

# Orca (Marlin flavor) emits M486 object-cancellation markers; Klipper's
# [exclude_object] speaks its own EXCLUDE_OBJECT_* dialect instead. The real
# object data is injected at upload time by Moonraker's object preprocessing
# ([file_manager] enable_object_processing: True), so the raw M486s are
# redundant — absorb them silently (found 2026-08-17 as unknown-command spam).
[gcode_macro M486]
gcode:
    # handled via Moonraker preprocess-cancellation -> EXCLUDE_OBJECT_*

[gcode_macro PARK]
description: Park the printhead (the vendor's G28.2 -> G28.1 X10 Y590)
gcode:
    {% if "xy" in printer.toolhead.homed_axes %}
        {% set o = printer.gcode_move.homing_origin %}
        G90
        G1 X{10 - o.x} Y{590 - o.y} F8000   ; machine coords — immune to tool
                                            ;   offsets (T1's -52.25 made naive
                                            ;   X10 out-of-range, 2026-08-17)
    {% else %}
        RESPOND TYPE=error MSG="PARK: home XY first"
    {% endif %}

[gcode_macro _CLIENT_Z_LIFT]
description: Lift Z by up to MM, clamped to remaining travel. Internal.
gcode:
    {% set want = params.MM|default(10)|float %}
    {% if "z" in printer.toolhead.homed_axes %}
        {% set room = printer.toolhead.axis_maximum.z - printer.toolhead.position.z %}
        {% set lift = [want, room]|min %}
        {% if lift > 0 %}
            G91
            G1 Z{lift} F198              # 200 mm/min mechanical ceiling
            G90
        {% endif %}
    {% endif %}

# ---------- Pause / resume — long-pause safe (2026-09-02) ---------------------
# INCIDENT 2026-09-02: a T0 runout paused a 1d6h print overnight. After 30 min
# Klipper's default idle_timeout gcode ran TURN_OFF_HEATERS + M84; M84 discards
# homing, so RESUME failed with "Must home axis first" and the part sat on a
# cold bed for 8 h. Fixes: (1) [idle_timeout] in printer.cfg now calls
# _IDLE_TIMEOUT below, which is pause-aware; (2) PAUSE records heater targets
# and RESUME re-heats from them, bed first and blocking.
[gcode_macro _PAUSE_STATE]
variable_ext0_target: 0
variable_ext1_target: 0
variable_bed_target: 0
gcode:
    RESPOND MSG="_PAUSE_STATE is a state holder"

[gcode_macro _IDLE_TIMEOUT]
description: Pause-aware idle timeout — invoked by [idle_timeout] in printer.cfg
gcode:
    {% if printer.pause_resume.is_paused %}
        ; PAUSED (runout or operator). NEVER M84 here: motors-off discards
        ; homing and there is a part on the bed. The BED STAYS at temperature —
        ; a large PLA part self-releases from cooling glass. The hotend goes to
        ; standby so hours at 220 C do not carbonise the filament; RESUME
        ; re-heats it from the targets PAUSE recorded.
        {% for e in ['extruder', 'extruder1'] %}
            {% if printer[e].target > 0 %}
                SET_HEATER_TEMPERATURE HEATER={e} TARGET=0
            {% endif %}
        {% endfor %}
        RESPOND TYPE=error MSG="Idle timeout while PAUSED: bed + homing KEPT, hotend on standby (RESUME re-heats)"
    {% else %}
        TURN_OFF_HEATERS
        M84
    {% endif %}

[gcode_macro PAUSE]
rename_existing: BASE_PAUSE
gcode:
    {% set act = printer.toolhead.extruder %}
    SAVE_GCODE_STATE NAME=pause_state
    BASE_PAUSE
    SET_GCODE_VARIABLE MACRO=_PAUSE_STATE VARIABLE=ext0_target VALUE={printer.extruder.target}
    SET_GCODE_VARIABLE MACRO=_PAUSE_STATE VARIABLE=ext1_target VALUE={printer.extruder1.target}
    SET_GCODE_VARIABLE MACRO=_PAUSE_STATE VARIABLE=bed_target VALUE={printer.heater_bed.target}
    {% if printer[act].can_extrude %}      ; the ACTIVE extruder (was hard-wired to T0)
        G91
        G1 E-5 F2700
        G90
    {% endif %}
    _CLIENT_Z_LIFT MM=5
    PARK

[gcode_macro RESUME]
rename_existing: BASE_RESUME
gcode:
    {% set ps = printer['gcode_macro _PAUSE_STATE'] %}
    {% set act = printer.toolhead.extruder %}
    {% set act_target = ps.ext0_target if act == 'extruder' else ps.ext1_target %}
    ; Re-heat whatever PAUSE recorded (each a no-op if already at temperature):
    ; bed FIRST and BLOCKING — never resume onto a cold bed — then the idle
    ; hotend non-blocking, then the active hotend blocking.
    {% if ps.bed_target > 0 %}
        M190 S{ps.bed_target}
    {% endif %}
    {% if ps.ext0_target > 0 and act != 'extruder' %}
        M104 S{ps.ext0_target} T0
    {% endif %}
    {% if ps.ext1_target > 0 and act != 'extruder1' %}
        M104 S{ps.ext1_target} T1
    {% endif %}
    {% if act_target > 0 %}
        M109 S{act_target} T{0 if act == 'extruder' else 1}
    {% endif %}
    ; RESTORE PRINT POSTURE (2026-09-03). The normal runout workflow is
    ; UNLOAD/LOAD_FILAMENT during the pause — and those deliberately leave the
    ; serviced head LIFTED and the other at midpoint. Resuming in that posture
    ; prints in the air (4 h lost 09-03; the 09-02 recovery only avoided it by
    ; hand). Lock the active head, lift the idle one — glides from tracked
    ; positions, idempotent if the posture is already right.
    {% set act_t = 0 if act == 'extruder' else 1 %}
    LIFT_HEAD T={1 - act_t}
    LOCK_HEAD T={act_t}
    {% if printer[act].can_extrude %}
        G91
        G1 E5 F2700
        G90
    {% endif %}
    RESTORE_GCODE_STATE NAME=pause_state MOVE=1 MOVE_SPEED=100
    BASE_RESUME

[gcode_macro CANCEL_PRINT]
rename_existing: BASE_CANCEL_PRINT
gcode:
    ; Cancel FIRST — everything after is cleanup, and a cleanup error must not
    ; resurrect the job. (2026-08-17: PARK errored out-of-range under T1's
    ; offset, the trailing base-cancel never ran, and the print RESUMED.)
    BASE_CANCEL_PRINT
    TURN_OFF_HEATERS
    M107
    {% if printer['gcode_macro CABINET_OFF'] is defined %}
        CABINET_OFF
    {% endif %}
    {% if printer['gcode_macro _TH'] is defined %}
        SET_GCODE_OFFSET X=0 Y=0 MOVE=0
        SET_GCODE_OFFSET Z_ADJUST={0 - printer['gcode_macro _TH'].tool_z_applied} MOVE=0
        SET_GCODE_VARIABLE MACRO=_TH VARIABLE=tool_z_applied VALUE=0
    {% endif %}
    _CLIENT_Z_LIFT MM=10
    PARK
    {% if printer['gcode_macro RELEASE_HEAD'] is defined %}
        RELEASE_HEAD T=0
        RELEASE_HEAD T=1
        SERVOS_OFF
    {% endif %}
