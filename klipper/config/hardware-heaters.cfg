# =============================================================================
#  STAGE 2 — heaters, bed, fan.
#
#  Hotends live in hardware-extruders.cfg (Klipper keeps motor+heater in one
#  [extruder] section, so they cannot be split across stage files).
#
#  ⚠ DO NOT COPY THE SMOOTHIEWARE PID VALUES. Klipper's PID scaling is different.
#     Run PID_CALIBRATE for every heater and SAVE_CONFIG.
#
#  Stage 2 exit criteria:
#     each heater reaches and holds setpoint with no oscillation and no
#     "Heater not heating at expected rate" shutdown.
# =============================================================================

# ---------- Bed ---------------------------------------------------------------
[heater_bed]
heater_pin: P2.7
sensor_type: Honeywell 100K 135-104LAG-J01   # matches Smoothieware 'Honeywell100K'
sensor_pin: P0.23
# control + pid gains -> printer.cfg autosave, set by PID_CALIBRATE.
# Klipper forbids autosaved options in included files (learned 2026-08-14).
# PID_CALIBRATE HEATER=heater_bed TARGET=60
#pid_Kp: 54.0
#pid_Ki: 0.77
#pid_Kd: 948
min_temp: 0
max_temp: 120                       # firmware allows 300; a 600x600 bed does not need it

# Klipper's runaway protection is ACTIVE here — a protection this machine never
# had (Smoothieware ran with watchdog_timeout 0 and both runaway timeouts 0).
# The flip side: a 600x600 bed gains heat slowly, and the default window
# (2 degC gain per 60 s) can false-trip mid-soak and shut the printer down.
# Relax the window rather than disabling the check.
[verify_heater heater_bed]
max_error: 240
check_gain_time: 120                #!! tune upward if the bed still trips it
hysteresis: 5

# ---------- Hotend cooling — BOTH fan channels (identified 2026-08-13/14) ----
# THIS MACHINE HAS NO PART COOLING. Each extruder carries TWO heatsink fans:
#   * FRONT fans  -> P0.26 (X5 GT FAN0; the vendor's switch.misc, M42/M43,
#                    on-at-boot + "M42 S100" in every start G-code)
#   * BACKSIDE fans -> P1.22 (X5 GT MISC; the vendor's switch.fan, M106/M107 —
#                    "M106 S319" in every start G-code = full-on all print.
#                    Confirmed by test: M106 spins the backside fans, which
#                    blow onto the heatsink, venting 90 degrees from the bed)
#
# Both are heat-creep protection, so BOTH are [heater_fan]: automatic whenever
# either hotend is warm, no G-code, no way to forget — and they keep running
# after TURN_OFF_HEATERS until the hotends drop below 50 C (free fast-cooldown,
# which the vendor's print-only M106 never provided during manual preheats).
[heater_fan hotend_heatsink_fans]
pin: P0.26
heater: extruder, extruder1         # either hotend hot -> both front fans run
heater_temp: 50.0
fan_speed: 1.0

[heater_fan hotend_backside_fans]
pin: P1.22
heater: extruder, extruder1
heater_temp: 50.0
fan_speed: 1.0

# With no [fan] defined, slicer M106/M107 would be unknown commands — absorb
# them silently. (If real part cooling is ever added, DELETE these two macros
# and give the new fan a proper [fan] section.)
[gcode_macro M106]
gcode:
    # no part cooling on this machine — heatsink fans are automatic

[gcode_macro M107]
gcode:
    # no part cooling on this machine

