# =============================================================================
#  STAGE 1 — steppers, drivers, endstops.  Motion only: no heat, no servos.
#
#  READ reference/pinmap.md FIRST. In particular:
#   * NO stepper here has an enable_pin. The X5 GT has no enable lines at all —
#     BSD2660 drivers are enabled over SPI. The vendor's *_en_pin values are
#     ignored template leftovers (they happen to equal the CS pins).
#     Motors therefore stay powered whenever the board is on; once bring-up is
#     done, set idle_current_percent in the [tmc2660] sections to drop current
#     at idle (Klipper CAN do this on TMC2660 — Smoothieware could not).
#   * cs_pin is assigned BY PHYSICAL SLOT, which for X and Y is the REVERSE of
#     what the vendor's Smoothieware config says. Their values appear to be
#     swapped; it is invisible today only because X and Y are identical.
#   * sense_resistor CONFIRMED 0.100 on all drivers (shunts read R100,
#     2026-08-13). That confirmation exposed a vendor bug: Smoothieware's
#     default sense_resistor is 50 mOhm and the motion drivers were left on
#     the default, so their currents were computed for HALF the real shunt —
#     and Smoothieware's mA figure is PEAK while Klipper's run_current is RMS.
#     Net effect: X/Y have always run ~0.88 A RMS (not "2.5 A"), Z ~0.55,
#     E ~0.58. The run_current values below REPLICATE those proven-safe
#     actuals. If X/Y ever lose steps, there is enormous verified-intent
#     headroom: raise live with SET_TMC_CURRENT STEPPER=stepper_x CURRENT=...
#     toward 1.77 (the vendor's intended 2500 mA peak), watching motor temp.
#
#  Stage 1 exit criteria:
#     QUERY_ENDSTOPS reports sane states, all three axes home, a 100 mm move
#     measures 100 mm on each axis, and no driver reports an SPI error.
# =============================================================================

# ---------- X (alpha) — drives the board's Z slot -----------------------------
[stepper_x]
step_pin: P2.2
dir_pin: P0.20                      # CONFIRMED 2026-08-13 — Klipper dir polarity is the
                                    #   OPPOSITE of every Smoothieware marking on this board
                                    #   (X/Y/Z all needed their carried '!' removed)
microsteps: 16
rotation_distance: 34.0             # 94.11765 steps/mm — exactly a 17-tooth GT2
endstop_pin: ^P1.25                 #!! VERIFY polarity: add '!' if inverted
position_endstop: -38               # alpha_min: X reads -38 after homing
position_min: -38                   # usable travel LEFT of the bed origin
position_max: 600
homing_speed: 50
second_homing_speed: 25
homing_retract_dist: 5
homing_positive_dir: False

[tmc2660 stepper_x]
cs_pin: P0.19                       # Z slot EN — see pinmap.md "collision"
spi_bus: ssp0                       # CONFIRMED: panel + drivers share SSP0 (P0.15 SCK / P0.18 MOSI)
sense_resistor: 0.100               # CONFIRMED — shunts read R100 (2026-08-13)
run_current: 0.88                   # replicates the ACTUAL historical current (see header):
                                    #   vendor's "2500 mA" x Smoothieware's 50-mOhm default
                                    #   against the real 100-mOhm shunt = CS 23 = 0.88 A RMS.
                                    #   Proven for years. Headroom to 1.77 if steps are lost.
interpolate: True                   # valid at 16 usteps (INTPOL is inert at any other MRES)

# ---------- Y (beta) — drives the board's Y slot ------------------------------
[stepper_y]
step_pin: P2.1
dir_pin: P0.11                      # CONFIRMED 2026-08-13 — see stepper_x note
microsteps: 16
rotation_distance: 34.0
endstop_pin: ^P1.24                 #!! VERIFY polarity
position_endstop: 600               # beta homes to MAX
position_min: 0
position_max: 600
homing_speed: 50
second_homing_speed: 25
homing_retract_dist: 5
homing_positive_dir: True

[tmc2660 stepper_y]
cs_pin: P0.10                       # Y slot EN
spi_bus: ssp0
sense_resistor: 0.100               # CONFIRMED R100
run_current: 0.88                   # actual historical current — see stepper_x
interpolate: True

# ---------- Z (gamma) — drives the board's E slot -----------------------------
# The only axis where the vendor's en_pin and spi_cs_pin agree (both 0.21),
# which is what proves EN == CS on this design.
[stepper_z]
step_pin: P2.3
dir_pin: P0.22                      # CONFIRMED at the machine 2026-08-13: the carried-over
                                    #   Smoothieware inversion (0.22!) was BACKWARDS under
                                    #   Klipper — +Z drove the bed toward the nozzle until the
                                    #   '!' was removed. Klipper/Smoothieware dir polarity
                                    #   conventions differ; expect X/Y/E1 may need the same flip.
microsteps: 8
rotation_distance: 0.5743           # CONFIRMED via dimensionally accurate prints (part height
                                    #   integrates this over hundreds of layers). Mechanism is a
                                    #   high-reduction LEAD SCREW — hence the fine 2785.88 st/mm.
# Z HOMES OFF THE NOZZLE-CONTACT PROBE — the vendor's true architecture,
# adopted 2026-08-14. Measured fact: the physical Z-min switch (P1.26) triggers
# with the bed 6.5 mm BELOW the nozzle plane — deliberate crash-safe homing;
# the vendor re-zeroed with G30.1 Q on every print and never used the endstop
# as the Z reference. Neither do we: G28 Z deploys the probe (via safe_z_home
# at the vendor's probe point) and touches the nozzle to the bed.
# P1.26 stays wired as a spare input.
endstop_pin: probe:z_virtual_endstop
position_min: -4                    # probing headroom. This bed is DISHED ~1.4-1.7 mm at the
                                    #   corners (mesh evidence), and z_offset recalibrations +
                                    #   thermal state shift the frame — at -2 the corner probes
                                    #   ran with ~0.3 mm margin and finally hit the floor
                                    #   ("No trigger on probe after full movement", 2026-08-17).
                                    #   Safe: probing stops at the trigger; prints never command
                                    #   negative Z.
position_max: 900
homing_speed: 3                     # gentler than the endstop era — this now
second_homing_speed: 1              #   presses a nozzle onto glass
homing_retract_dist: 2
homing_positive_dir: False

[tmc2660 stepper_z]
cs_pin: P0.21                       # E slot EN — matches the vendor's own value
spi_bus: ssp0
sense_resistor: 0.100               # CONFIRMED R100
run_current: 0.55                   # actual historical current: "1500 mA" x the same 50-vs-100
                                    #   mOhm bug = CS 14 = 0.55 A RMS. See stepper_x header.
interpolate: False                  # TMC2660 INTPOL only functions at 16 usteps; inert at 8.
                                    # (Raising Z to microsteps:16 later is free — rotation_distance
                                    # is physical and does NOT change with microsteps in Klipper.)

# ---------- custom thermistor — RETIRED (2026-08-13) --------------------------
# The vendor config's "beta 4066" was a decoy: at first Klipper boot both
# hotends read 172.8 C at ~23 C ambient through this curve — implied resistance
# 1088 ohm, which is a PT1000 at room temperature, exactly. The hotend sensors
# are PT1000s (see hardware-extruders.cfg); this definition is kept only as a
# record of what the vendor config *claimed*.
#[thermistor NW_hotend]
#temperature1: 25
#resistance1: 100000
#beta: 4066
