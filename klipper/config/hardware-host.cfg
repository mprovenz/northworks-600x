# =============================================================================
#  STAGE 5 — Raspberry Pi GPIO via Klipper's Linux MCU.
#
#  Replaces the vendor's /usr/local/bin scripts (lights, cabinet, machine,
#  jreset), which call the `gpio` binary from wiringPi — a library that no
#  longer exists on modern Raspberry Pi OS. Doing it here means one config and
#  real G-code control.
#
#  Requires the Linux MCU to be installed and running:
#     cd ~/klipper && make menuconfig     -> Linux process
#     make flash
#     sudo cp ./scripts/klipper-mcu.service /etc/systemd/system/
#     sudo systemctl enable klipper-mcu.service
#
#  ⚠ TWO PINS DELIBERATELY OMITTED:
#     GPIO 4  (machine power) and GPIO 24 (controller reset) must stay
#     host-side. They power and reset the very MCU Klipper is talking to;
#     Klipper cannot sanely own its own power switch. Keep a small systemd
#     unit or script for those, mirroring `machine` and `jreset`.
# =============================================================================

[mcu host]
serial: /tmp/klipper_host_mcu

# ---------- Lights (BCM 17, active-low) --------------------------------------
[output_pin lights]
pin: !host:gpiochip0/gpio17         # '!' = active-low, matching `gpio -g write 17 0` == ON
value: 1                            # boot default is ON (config.txt gpio=17=op,dl)
shutdown_value: 0

[gcode_macro LIGHTS_ON]
gcode:
    SET_PIN PIN=lights VALUE=1

[gcode_macro LIGHTS_OFF]
gcode:
    SET_PIN PIN=lights VALUE=0

# ---------- Cabinet heater enable (BCM 27, active-low) -----------------------
# This switches the EXTERNAL PID controller, which keeps its own setpoint and —
# importantly — its own over-temperature cutout. Leave that safety in circuit:
# this machine has watchdog_timeout 0, both runaway timeouts 0, and
# halt_on_alarm false on every driver.
[output_pin cabinet]
pin: !host:gpiochip0/gpio27
value: 0                            # SAFER than the vendor default, which was ON at boot
shutdown_value: 0

[gcode_macro CABINET_ON]
gcode:
    SET_PIN PIN=cabinet VALUE=1
    RESPOND MSG="Cabinet heater enabled (external PID holds the setpoint)"

[gcode_macro CABINET_OFF]
gcode:
    SET_PIN PIN=cabinet VALUE=0

# ---------- Filament sensors --------------------------------------------------
# The vendor plugin bolted the second sensor onto its "jam" channel because it
# only had one runout channel. Klipper has no such limit — both are proper
# runout sensors here, and unlike the plugin they also work when idle.
#
# MEASURED 2026-08-14 — the vendor had BOTH channels wrong:
#   * the tool assignment was SWAPPED: GPIO 22 (their "T0 runout") physically
#     watches T1's filament path, GPIO 23 (their "T1 jam") watches T0's;
#   * their "normally closed" polarity on the GPIO 23 channel was inverted.
# This finally explains why no recovered log ever shows either sensor firing:
# as the vendor configured them, they could not have worked. Runout protection
# on this machine is genuinely functional for the first time.
[filament_switch_sensor t0_runout]
switch_pin: ^host:gpiochip0/gpio23  # CONFIRMED by test — the vendor's "T1/jam" channel
pause_on_runout: True
runout_gcode:
    RESPOND TYPE=error MSG="LEFT head (T0) filament runout"

[filament_switch_sensor t1_runout]
switch_pin: ^host:gpiochip0/gpio22  # CONFIRMED by test — the vendor's "T0/runout" channel
pause_on_runout: True
runout_gcode:
    RESPOND TYPE=error MSG="RIGHT head (T1) filament runout"

# ---------- Electronics monitoring (added 2026-08-14) -------------------------
# Pi CPU temperature on the Fluidd graph — becomes genuinely important once the
# heated chamber warms the compartment the electronics share.
# NB: no [temperature_sensor] for the controller — the LPC1769 has no on-die
# temperature sensor, so Klipper's temperature_mcu is unsupported on this MCU.
[temperature_sensor raspberry_pi]
sensor_type: temperature_host
min_temp: 0
max_temp: 85

# ---------- Physical shutdown button (BCM 3) ---------------------------------
# The Pi's gpio-shutdown overlay already handles this at the OS level
# (dtoverlay=gpio-shutdown,gpio_pin=3). Left to the OS — do not claim it here.
