# =============================================================================
#  Northworks Automation 600x — Klipper printer.cfg  (KIT TEMPLATE)
#  600 x 600 x 900 mm · CoreXY · dual servo-lifted heads · LPC1769 · TMC2660 x5
#
#  IN PRODUCTION since 2026-08-13. The MACHINE's copy is the master: it carries
#  the real MCU serial and the SAVE_CONFIG autosave block (probe z_offset, three
#  PID sets, the default bed mesh). This template = the machine file minus those.
#  On a rebuild: copy this in, set [mcu] serial, RESTART, then let PID_CALIBRATE /
#  PROBE_CALIBRATE / BED_MESH_CALIBRATE + SAVE_CONFIG regenerate the autosave block.
#  ⚠ Never hand-write the "#*#" autosave marker — Klipper needs its exact 3-line
#  header or SAVE_CONFIG fails with "Existing config autosave is corrupted".
#  Full rebuild procedure: ../REBUILD.md
# =============================================================================

# ALWAYS included — Klipper will not start without them. [extruder] owns both
# the motor and the hotend in one section, so heaters cannot be staged out.
# "STAGE 1" therefore means: do not COMMAND heat yet, not that heat is undefined.
[include hardware-steppers.cfg]     # X / Y / Z + TMC2660 + thermistor definition
[include hardware-extruders.cfg]    # E0 / E1 — motor AND hotend together
[include hardware-heaters.cfg]      # bed, fan, (chamber placeholder)
[include macros-client.cfg]         # PAUSE/RESUME/CANCEL_PRINT/PARK — Fluidd
                                    #   requires these to exist; written stage-safe

# Genuinely optional — uncomment one at a time, in this order.
[include macros-toolhead.cfg]      # STAGE 4 — head lift/lock servos, T0/T1.
                                    #   Do this BEFORE the probe: the lift servo
                                    #   IS the probe deploy mechanism.
[include hardware-probe.cfg]       # STAGE 3 — probe + bed mesh (after stage 4).
[include hardware-host.cfg]        # STAGE 5 — Pi GPIO: lights, cabinet, filament.
[include macros-print.cfg]         # STAGE 6 — PRINT_START/END + maintenance.
[include macros-operator.cfg]
[include timelapse.cfg]

[include macros-tuning.cfg]
# -----------------------------------------------------------------------------
# MCU
# -----------------------------------------------------------------------------
[mcu]
#!! VERIFY: find the real path with  ls /dev/serial/by-id/*
# The board enumerates as USB CDC. Under Smoothieware it appeared as
# /dev/ttyACM0; Klipper's own USB id will differ after flashing.
serial: /dev/serial/by-id/usb-Klipper_lpc1769_CHANGE-ME-if00   # ls /dev/serial/by-id/

# -----------------------------------------------------------------------------
# Kinematics and machine limits
# -----------------------------------------------------------------------------
[printer]
kinematics: corexy
# ⚠ CoreXY sqrt(2) TRAP — this bit a real print.
#   On CoreXY a 45-degree move drives ONE motor at v*sqrt(2). The LIVE per-
#   actuator ceiling was 333 mm/s (config-override M203.1 X333 Y333 supersedes
#   the config file's 19000 mm/min), so any cartesian velocity above
#   333/sqrt(2) = 235 mm/s overruns a motor on diagonals. A 250 mm/s travel in
#   an OrcaSlicer profile produced exactly that: cumulative DIAGONAL layer
#   shift, because it is the diagonal moves that overrun.
#   The vendor's own proven profile never exceeded 133 mm/s.
max_velocity: 200                   # <= 235. Raise only after testing.
max_accel: 3200                     # certified 2026-08-17 (clean at 4000; 0.8 margin)
max_z_velocity: 3.3                 # 200 mm/min — MECHANICAL. Klipper cannot improve it.
max_z_accel: 50
# Smoothieware junction_deviation 0.025 mm. Klipper uses square_corner_velocity
# instead; 5 mm/s is the Klipper default and a sane starting point. These are
# NOT the same parameter and do not convert directly.
square_corner_velocity: 5.0

# -----------------------------------------------------------------------------
# Housekeeping
# -----------------------------------------------------------------------------
[idle_timeout]
# This board has no stepper enable lines (BSD2660s are SPI-enabled), so motors
# stay powered — but unlike Smoothieware, Klipper CAN drop TMC2660 current when
# this timeout expires: set idle_current_percent (e.g. 25) in the [tmc2660]
# sections once bring-up is done.
timeout: 1800
gcode: _IDLE_TIMEOUT                # macros-client.cfg — PAUSE-AWARE (2026-09-02): while
                                    #   paused it keeps the bed + homing and puts the hotend
                                    #   on standby; otherwise the Klipper default
                                    #   (TURN_OFF_HEATERS + M84). Klipper's default gcode
                                    #   M84'd a paused overnight print and lost homing.

[force_move]
# Lets you jog an axis before homing works — invaluable during stage 1.
# Disable once bring-up is done.
enable_force_move: True

[virtual_sdcard]
path: ~/printer_data/gcodes

[display_status]
[pause_resume]
[exclude_object]

[respond]

# -----------------------------------------------------------------------------
# SAVE_CONFIG — Klipper appends PID and mesh results below this line.
# -----------------------------------------------------------------------------
