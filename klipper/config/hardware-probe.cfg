# =============================================================================
#  STAGE 3 — Z probe and bed mesh.
#
#  ⚠ ARCHITECTURE NOTE, read before touching this:
#     The probe is NOT a separate sensor on an arm. M565 reports zero XY offset,
#     and the probe deploy positions (zprobe.probe_up 7.4 / probe_down 5.4) are
#     within a rounding error of the T0 head lift/lock servo positions
#     (M673 A7.15 / B5.25). The head-lift servo and the probe deploy are the
#     SAME MECHANISM — the head is lowered onto a contact sensor.
#
#     The CAM question (M676/M518) was settled 2026-08-13: no observable action,
#     treated as vestigial. Enable this stage only after the servo widths in
#     macros-toolhead.cfg have passed their confirmation pass (PREFLIGHT §3).
#
#  Stage 3 exit criteria:
#     PROBE_ACCURACY repeats within ~0.02 mm, and a full BED_MESH_CALIBRATE
#     completes without a crash or a missed trigger.
# =============================================================================

# ---------- Sensor power and mode — SEMANTICS CONFIRMED 2026-08-14 -----------
# The probe sensor boards have a power line (P1.18), a calibrate/mode line
# (P1.21), and a power-up ritual:
#   * P1.21 floating -> LEDs flash, output inert. Driven LOW -> run mode. ✔
#   * After power-up the board sets its reference on the FIRST head-lift
#     transition; until then the output stays inert (LEDs dark).
# Therefore: power the sensor FROM BOOT (like the vendor did — their LEDs
# worked at all times) and NEVER power-cycle it per probe: a stow-time
# power-off would reset it, and the next probe's first touch might not
# register. The lift-first wake in activate_gcode below guarantees a fresh
# reference transition before every descent regardless of restart history.
[output_pin probe_sensor_power]
pin: P1.18
value: 1                            # ON from boot — deliberately
shutdown_value: 0

[output_pin probe_calibrate]
pin: P1.21
value: 0                            # run mode (confirmed: flashing stopped, reads correct)
shutdown_value: 0

# ---------- Probe posture selector (2026-08-18) -------------------------------
# The [probe] normally deploys to the VENDOR'S probe posture (t0_probe_down,
# 1.080 ms) — deliberately LESS engaged than the printing lock (t0_down,
# 1.050 ms), which means less force through the linkage and the nozzle on every
# touch. That is the right default for the 144-point mesh and for homing.
#
# Setting locked=1 makes the NEXT probe operation deploy to the LOCKED
# (printing) posture instead, so PROBE / PROBE_ACCURACY measure the zero in the
# posture the machine actually prints in — removing the ~0.10 mm posture gap.
# FAIL-SAFE: deactivate_gcode resets this to 0, so the flag is one-shot per
# probe operation and an aborted probe cannot leave homing in locked posture.
[gcode_macro _PROBE_CFG]
variable_locked: 0
gcode:
    RESPOND MSG="_PROBE_CFG is a state holder"

# ---------- Probe — T0 --------------------------------------------------------
[probe]
pin: ^P1.19                         #!! VERIFY polarity (add '!' if NC)
x_offset: 0                         # M565 X0 Y0 Z0 — coaxial with the nozzle
y_offset: 0
# z_offset: -> lives in printer.cfg autosave, set by PROBE_CALIBRATE (paper test).
                                    # Klipper forbids autosaved options in included files.
                                    # Historical: live M670 O-0.5200 (card said -0.21; it drifts —
                                    # which is exactly why the paper test, not arithmetic, sets it).
speed: 0.5                          # zprobe.slow_feedrate 0.5 mm/s
lift_speed: 3.3                     # Z ceiling
samples: 2                          # zprobe sample_count 2
samples_result: median
sample_retract_dist: 2
samples_tolerance: 0.05
samples_tolerance_retries: 3

# Deploy/stow run the head-lift servo. Sensor power stays ON (see above).
# Deploy lifts FIRST — that guarantees the sensor sees a lift transition (its
# reference/wake event) immediately before every descent — then lowers to the
# vendor's dedicated probe position (slightly different from lock/raise).
deactivate_on_each_sample: False    # keep deployed across multi-sample probes —
                                    #   less servo wear, and the reference holds
# ⚠ NO GLIDES ON THE ACTIVATE SIDE — deliberately, learned 2026-08-14. The
# sensor self-references on lift transitions: a slow glide through
# intermediate positions lets it re-reference MID-RAMP, after which the
# seated position reads as "lifted" (TRIGGERED) and homing accepts a phantom
# touch instantly. Every move BEFORE a measurement (wake-lift, deploy) must
# therefore be a crisp, deterministic snap. The stow (deactivate below) runs
# AFTER the measurement and is the one probe move allowed to glide.
activate_gcode:
    ; SAFETY: the idle T1 head must be clear of the bed for ANY probing.
    ; ⚠ It must be at the released MIDPOINT with its SERVO OFF — NOT held
    ; lifted: an energized servo dithers, and that vibration feeds through the
    ; carriage into T0's motion-sensing probe, causing phantom triggers the
    ; moment the bed starts moving (root-caused 2026-08-17 after the held-lift
    ; "safety" change broke homing). Mid is unpowered-stable and SILENT, and
    ; still clears the bed (which stops at T0's nozzle, below T1's at mid).
    RELEASE_HEAD T=1
    SET_SERVO SERVO=head1_lift WIDTH=0
    SET_PIN PIN=probe_sensor_power VALUE=1
    SET_SERVO SERVO=head0_lift WIDTH={printer['gcode_macro _TH'].t0_probe_up}
    G4 P400
    SET_SERVO SERVO=head0_lift WIDTH={printer['gcode_macro _TH'].t0_down if printer['gcode_macro _PROBE_CFG'].locked == 1 else printer['gcode_macro _TH'].t0_probe_down}
    G4 P500
    ; timings above are the PROVEN bring-up values (0.005 mm accuracy era) —
    ; the longer "settle" experiment made phantoms worse, consistent with the
    ; sensor re-referencing to maximum sensitivity during long stillness.
    SET_GCODE_VARIABLE MACRO=_TH VARIABLE=t0_pos VALUE={printer['gcode_macro _TH'].t0_down if printer['gcode_macro _PROBE_CFG'].locked == 1 else printer['gcode_macro _TH'].t0_probe_down}
deactivate_gcode:
    ; STOW — the ONE probe-path move that may glide (audit 2026-08-17): by the
    ; time deactivate runs the measurement is complete, so the mid-ramp
    ; re-reference that forbids glides on the deploy side is harmless here.
    ; Expected side effect: the sensor can be left READING TRIGGERED (Fluidd
    ; "probe: triggered") after the glide, until the next activate's crisp
    ; wake-lift re-references it. Cosmetic only — Klipper's "probe triggered
    ; prior to movement" check runs AFTER activate_gcode, which always
    ; restores a clean reference first.
    _HEAD_MOVE T=0 TARGET={printer['gcode_macro _TH'].t0_probe_up}
    SET_GCODE_VARIABLE MACRO=_PROBE_CFG VARIABLE=locked VALUE=0

# ---------- The T1 probe (P1.20) ---------------------------------------------
# Klipper supports exactly one [probe], so T1's sensor is a polled
# [gcode_button] instead — see MEASURE_TIP_DELTA below, which rebuilds the
# vendor's live tip-delta measurement (their G30.3 D T1). The earlier
# "measure once, fixed offset" doctrine is retired: paper tests and vendor
# history both show this mechanism drifts, which is why the vendor measured
# at every print start. Value lands in _TH t1_z.

# ---------- Z-offset calibration with enforced posture (2026-08-17) -----------
# The stock PROBE_CALIBRATE stows the head (deactivate_gcode) before the manual
# paper-test phase — so the offset was being measured in a NON-printing posture.
# That posture error is what the operator's +0.365 empirical fudge was
# compensating for. This wrapper: T1 lifted (belt-and-braces; activate does it
# too), auto-probe as normal, then LOCK T0 into true printing posture before
# the paper test opens. ~2 mm of probe-retract clearance covers the small
# deploy-vs-locked servo difference.
# ⚠ After deploying this, REDO the calibration — the properly-postured
# z_offset supersedes the old value AND its fudge; expect the Tune-panel
# correction to land near zero on the next first layer.
[gcode_macro PROBE_CALIBRATE]
rename_existing: BASE_PROBE_CALIBRATE
description: Z-offset calibration — auto-probe, then paper test with T0 LOCKED
gcode:
    ; T1 posture is enforced by the probe's own activate (mid, servo off) —
    ; no explicit lift here (a HELD T1 causes phantom triggers; see activate).
    BASE_PROBE_CALIBRATE {rawparams}
    LOCK_HEAD T=0
    RESPOND MSG="T0 LOCKED (printing posture) — paper-test with TESTZ, then ACCEPT and SAVE_CONFIG"


# ---------- Live T1 tip-delta measurement (2026-08-17) ------------------------
# Rebuilds the vendor's G30.3 D T1: after T0's zero (any G28), measure T1's tip
# with T1's OWN contact sensor (P1.20) and set the delta. The vendor ran this
# every print start because the mechanism drifts — paper-test history agrees.
# Klipper allows one [probe], so the second sensor is a polled [gcode_button]
# driven by a stepped descent: 0.02 mm per step, ~1 mm/s, +-0.02 mm result.
[gcode_button t1_probe]
pin: ^P1.20                         #!! assumed same polarity as T0's sensor; if the
                                    #   macro errors "already triggered", use ^!P1.20
press_gcode:
    ; Echo only while a measurement is running — the motion-sensing head fires
    ; this constantly during prints (dither, carriage accel, contact) and the
    ; tick macros read STATE, not this event (noise fix 2026-09-03).
    {% if printer['gcode_macro _T1M'].active == 1 or printer['gcode_macro _MLD'].active == 1 %}
        RESPOND MSG="T1 sensor contact"
    {% endif %}

[gcode_macro _T1M]
variable_active: 0
gcode:
    RESPOND MSG="_T1M is a state holder"

[gcode_macro MEASURE_TIP_DELTA]
description: Measure T1 tip delta vs T0 zero (vendor G30.3). Run after G28.
gcode:
    {% if "xyz" not in printer.toolhead.homed_axes %}
        RESPOND TYPE=error MSG="MEASURE_TIP_DELTA: G28 first"
    {% elif printer.gcode_move.homing_origin.x|abs > 0.01 %}
        RESPOND TYPE=error MSG="MEASURE_TIP_DELTA: a tool offset is active - run T0 first"
    {% elif printer['gcode_button t1_probe'].state|upper == "PRESSED" %}
        RESPOND TYPE=error MSG="MEASURE_TIP_DELTA: T1 sensor already triggered at rest - check polarity (^!P1.20?) / reference"
    {% else %}
        {% set th = printer['gcode_macro _TH'] %}
        G90
        G1 Z5 F198
        G1 X237.75 Y310 F6000       ; T1 tip over the probe point (290 - 52.25)
        ; T0 clear at mid, UNPOWERED - its servo dither would shake the sensor
        RELEASE_HEAD T=0
        SET_SERVO SERVO=head0_lift WIDTH=0
        ; T1: wake-lift (sensor reference) then snap to its probe posture -
        ; same rules as T0's probe: crisp snaps, no glides near a measurement
        SET_SERVO SERVO=head1_lift WIDTH={th.t1_up}
        G4 P400
        SET_SERVO SERVO=head1_lift WIDTH={th.t1_probe_down}
        G4 P500
        SET_GCODE_VARIABLE MACRO=_TH VARIABLE=t1_pos VALUE={th.t1_probe_down}
        G1 Z0.8 F198                ; start above the plausible trigger band
        SET_GCODE_VARIABLE MACRO=_T1M VARIABLE=active VALUE=1
        UPDATE_DELAYED_GCODE ID=_t1m_tick DURATION=2
        RESPOND MSG="Measuring T1 tip delta (stepped descent)..."
    {% endif %}

[delayed_gcode _t1m_tick]
gcode:
    {% if printer['gcode_macro _T1M'].active == 1 %}
        {% set z = printer.toolhead.position.z %}   ; kinematic Z — immune to
                                                    ;   babysteps and offsets
        {% if printer['gcode_button t1_probe'].state|upper == "PRESSED" %}
            {% set cal = printer['gcode_macro _TH'].t1_sensor_cal %}
            SET_GCODE_VARIABLE MACRO=_T1M VARIABLE=active VALUE=0
            SET_GCODE_VARIABLE MACRO=_TH VARIABLE=t1_z VALUE={(z + cal)|round(3)}
            RESPOND MSG="T1 tip delta: raw {z|round(3)} + sensor cal {cal} = {(z + cal)|round(3)} mm - APPLIED for this session (_TH t1_z)."
            G91
            G1 Z3 F198
            G90
            SET_SERVO SERVO=head1_lift WIDTH={(printer['gcode_macro _TH'].t1_up + printer['gcode_macro _TH'].t1_down) / 2}
            G4 P500
            SET_GCODE_VARIABLE MACRO=_TH VARIABLE=t1_pos VALUE={(printer['gcode_macro _TH'].t1_up + printer['gcode_macro _TH'].t1_down) / 2}
            SET_SERVO SERVO=head1_lift WIDTH=0
        {% elif z <= -1.5 %}
            SET_GCODE_VARIABLE MACRO=_T1M VARIABLE=active VALUE=0
            RESPOND TYPE=error MSG="MEASURE_TIP_DELTA: no trigger by Z-1.5 - aborted; check sensor"
            G91
            G1 Z3 F198
            G90
            SET_SERVO SERVO=head1_lift WIDTH={(printer['gcode_macro _TH'].t1_up + printer['gcode_macro _TH'].t1_down) / 2}
            G4 P500
            SET_GCODE_VARIABLE MACRO=_TH VARIABLE=t1_pos VALUE={(printer['gcode_macro _TH'].t1_up + printer['gcode_macro _TH'].t1_down) / 2}
            SET_SERVO SERVO=head1_lift WIDTH=0
        {% else %}
            G91
            G1 Z-0.02 F60
            G90
            UPDATE_DELAYED_GCODE ID=_t1m_tick DURATION=0.15
        {% endif %}
    {% endif %}


# ---------- Z-drift sentinel — the backup switch earns a job (2026-08-17) -----
# The probe's per-print zero is exact EXCEPT for its trigger-to-contact
# preload (epsilon), which lives in the stored z_offset and has been observed
# to drift (~0.4 mm, 2026-08-17). The spare physical Z switch (P1.26, bed-side,
# ~6.5 mm below the nozzle plane) is immune to that preload chain — a fixed
# frame reference. Calibrate its position ONCE against a trusted zero; any
# later disagreement IS the epsilon drift, measured.
#   Z_REF_CALIBRATE  — run right after a trusted PROBE_CALIBRATE + good first
#                      layer; records the switch position (persist in cfg).
#   Z_DRIFT_CHECK    — anytime after G28: measures, reports drift, and
#                      auto-corrects the session (Z_ADJUST) within +-0.5 mm.
#                      Fold a confirmed correction permanently with
#                      Z_OFFSET_APPLY_PROBE (T0 active) + re-mesh.
# NB v1 is an operator command (the stepped poll is asynchronous — do not call
# from PRINT_START). Same calibrated constant later serves power-loss recovery.
[gcode_button z_ref_switch]
pin: ^P1.26                         # polarity proven in phase-3 endstop duty
press_gcode:
    {% if printer['gcode_macro _ZREF'].active == 1 %}
        RESPOND MSG="Z reference switch contact"
    {% endif %}

[gcode_macro _ZREF]
variable_ref: -1.0                  # calibrated switch Z in true-zero coords; -1 = uncalibrated
variable_active: 0
variable_mode: ""
gcode:
    RESPOND MSG="_ZREF is a state holder"

[gcode_macro Z_REF_CALIBRATE]
description: Record the backup switch position against a TRUSTED zero (run once)
gcode:
    {% if "xyz" not in printer.toolhead.homed_axes %}
        RESPOND TYPE=error MSG="Z_REF_CALIBRATE: G28 first"
    {% elif printer['gcode_button z_ref_switch'].state|upper == "PRESSED" %}
        RESPOND TYPE=error MSG="Z_REF_CALIBRATE: switch already pressed at start - check polarity/position"
    {% else %}
        G90
        G1 Z5.5 F198                ; just above the switch band (~6.5)
        SET_GCODE_VARIABLE MACRO=_ZREF VARIABLE=mode VALUE="'calibrate'"
        SET_GCODE_VARIABLE MACRO=_ZREF VARIABLE=active VALUE=1
        UPDATE_DELAYED_GCODE ID=_zref_tick DURATION=1.5
        RESPOND MSG="Measuring backup-switch position..."
    {% endif %}

[gcode_macro Z_DRIFT_CHECK]
description: Compare probe zero against the backup switch; correct session drift
gcode:
    {% if "xyz" not in printer.toolhead.homed_axes %}
        RESPOND TYPE=error MSG="Z_DRIFT_CHECK: G28 first"
    {% elif printer['gcode_macro _ZREF'].ref < 0 %}
        RESPOND TYPE=error MSG="Z_DRIFT_CHECK: run Z_REF_CALIBRATE first (then persist variable_ref)"
    {% elif printer['gcode_button z_ref_switch'].state|upper == "PRESSED" %}
        RESPOND TYPE=error MSG="Z_DRIFT_CHECK: switch already pressed at start - check polarity/position"
    {% else %}
        G90
        G1 Z5.5 F198
        SET_GCODE_VARIABLE MACRO=_ZREF VARIABLE=mode VALUE="'check'"
        SET_GCODE_VARIABLE MACRO=_ZREF VARIABLE=active VALUE=1
        UPDATE_DELAYED_GCODE ID=_zref_tick DURATION=1.5
        RESPOND MSG="Checking Z drift against the backup switch..."
    {% endif %}

[delayed_gcode _zref_tick]
gcode:
    {% if printer['gcode_macro _ZREF'].active == 1 %}
        {% set z = printer.toolhead.position.z %}   ; kinematic - offset/babystep immune
        {% set zr = printer['gcode_macro _ZREF'] %}
        {% if printer['gcode_button z_ref_switch'].state|upper == "PRESSED" %}
            SET_GCODE_VARIABLE MACRO=_ZREF VARIABLE=active VALUE=0
            {% if zr.mode == 'calibrate' %}
                SET_GCODE_VARIABLE MACRO=_ZREF VARIABLE=ref VALUE={z|round(3)}
                RESPOND MSG="Backup switch at Z {z|round(3)} - stored for session. PERSIST: set variable_ref in hardware-probe.cfg"
            {% else %}
                {% set drift = (z - zr.ref)|round(3) %}
                {% if drift|abs < 0.03 %}
                    RESPOND MSG="Z drift check: {drift} mm vs reference - healthy, no action"
                {% elif drift|abs <= 0.5 %}
                    SET_GCODE_OFFSET Z_ADJUST={drift} MOVE=0
                    RESPOND TYPE=error MSG="Z drift detected: {drift} mm - session CORRECTED via Z_ADJUST. If it persists across checks, recalibrate z_offset (Z_OFFSET_APPLY_PROBE on T0) and RE-MESH"
                {% else %}
                    RESPOND TYPE=error MSG="Z drift {drift} mm EXCEEDS 0.5 sanity band - NOT corrected. Investigate (crash? loose switch? bed change?)"
                {% endif %}
            {% endif %}
            G90
            G1 Z5 F198
        {% elif z >= 8.5 %}
            SET_GCODE_VARIABLE MACRO=_ZREF VARIABLE=active VALUE=0
            RESPOND TYPE=error MSG="Z reference: no switch contact by Z8.5 - aborted, check the switch"
            G90
            G1 Z5 F198
        {% else %}
            G91
            G1 Z0.02 F60
            G90
            UPDATE_DELAYED_GCODE ID=_zref_tick DURATION=0.15
        {% endif %}
    {% endif %}

# ---------- Bed mesh ----------------------------------------------------------
[bed_mesh]
speed: 100
horizontal_move_z: 3                # leveling-strategy initial_height 3
mesh_min: 20, 20                    #!! VERIFY reachable with the probe deployed
mesh_max: 580, 580
probe_count: 12, 12                 # RAISED 2026-08-18 (was 8,8 = the vendor's grid).
                                    #   144 points at 0.5 mm/s x2 samples ~= 31 min per mesh.
                                    #   Outermost points are unchanged (mesh_min/max fixed), so
                                    #   this adds interior detail only - no new corner-trigger
                                    #   exposure at position_min -4.
algorithm: bicubic
bicubic_tension: 0.2
fade_start: 2.5                     # dampening_start 2.5
fade_end: 25                        # height_limit 25 — no compensation above this
fade_target: 0
# The last stored vendor mesh spanned 2.04 mm across the bed. Klipper's mesh is
# considerably better than Smoothieware's 8x8 + the hgrid outlier filter (which
# has a 7x7-vs-8x8 buffer overflow), so hgrid is not needed here at all.
# Re-level the bed mechanically first — 2 mm is a lot to ask compensation for.

# ---------- Bed screw assistant ----------------------------------------------
# Replaces the vendor's G33 3-point level, which reported screw turns via a
# "Leveling: a b c" line. mount_turns_mm 0.91 => 1 mm of Z per 0.91 turns.
[screws_tilt_adjust]
screw1: 125, 410
screw1_name: rear left
screw2: 485, 410
screw2_name: rear right
screw3: 295, 115
screw3_name: front centre
horizontal_move_z: 5
speed: 100
screw_thread: CW-M4                 #!! VERIFY — mount_turns_mm 0.91 does not match
                                    #   a standard M3/M4 pitch; measure the screws

[safe_z_home]
home_xy_position: 290, 310          # zprobe.x_pos / y_pos
speed: 100
z_hop: 5
z_hop_speed: 3.3

# After any home that used the probe, relax both heads to the released
# midpoint and power off (operator request 2026-08-17 — probing otherwise
# leaves T1 held lifted and T0 held at probe_up, both immovable by hand).
# XY-only homes (e.g. TEST_SPEED's G28 X Y) skip this — no probe involved.
# PRINT_START re-establishes print posture afterwards via T{tool} regardless.
[gcode_macro G28]
rename_existing: G2828
# (rename target must be classic G-code style — Klipper rejects 'G28_BASE'.
#  G2828 chosen as guaranteed-unused; NB the vendor-era "G28.1" meant
#  something else, so it is deliberately avoided.)
gcode:
    G2828 {rawparams}
    {% set p = rawparams|upper %}
    {% if printer['gcode_macro RELEASE_HEAD'] is defined and ('Z' in p or p|trim == '') %}
        RELEASE_HEAD T=0
        RELEASE_HEAD T=1
        SET_SERVO SERVO=head0_lift WIDTH=0
        SET_SERVO SERVO=head1_lift WIDTH=0
    {% endif %}

# ---------- Probe-based Z homing — ADOPTED 2026-08-14 -------------------------
# Not optional after all: the physical Z endstop was measured to trigger with
# the bed 6.5 mm below the nozzle plane (deliberate vendor design — crash-safe
# homing, with G30.1 Q supplying true zero on every print). [stepper_z] now
# uses endstop_pin: probe:z_virtual_endstop, and safe_z_home (below) homes Z at
# the vendor's probe point. Every G28 Z is a true nozzle-touch zero, which also
# absorbs any servo-reseat variation between prints. The physical switch
# (P1.26) remains wired as a spare.

# ---------- Locked-posture tip measurement (2026-08-18) -----------------------
# MEASURE_TIP_DELTA measures T1 at t1_probe_down (1.920 ms) but the machine
# PRINTS at t1_down (1.815 ms) — and T1's sense is reversed, so the probe
# posture presses the head FURTHER DOWN than printing ever does. T0 has the
# mirror problem (probe 1.080 vs locked 1.050). Both readings therefore carry a
# posture error, and t1_sensor_cal has been absorbing it — badly.
#
# This measures BOTH tips with their OWN sensors, each in its OWN LOCKED
# (printing) posture, at the SAME bed point, in one session:
#     delta = (T1 trigger Z) - (T0 trigger Z)
# Because both are referenced to the same kinematic frame in the same run, the
# result is independent of the probe z_offset AND of epsilon drift — the two
# things that have made every previous number disagree.
#
# Reports only; it does not apply anything. Persist with SET_RIGHT_Z VALUE=<n>.
#
# ⚠ THE TWO PHASES DO NOT SAMPLE THE SAME WAY — known asymmetry, 2026-08-18.
#   T0's sensor is the [probe] object, so it cannot also be a [gcode_button]
#   (Klipper forbids pin reuse). It is polled with QUERY_PROBE, whose result
#   lands in printer.probe.last_query and is read on the NEXT tick (a macro's
#   template renders before its commands run). There is NO position error from
#   that — the toolhead does not move between the query and the read, so the
#   recorded Z matches the queried Z. (An earlier comment here claimed a 0.02 mm
#   latency error; that was wrong.)
#   The REAL asymmetry is in signal conditioning:
#     * T0 via QUERY_PROBE = a single INSTANTANEOUS, unfiltered endstop sample.
#     * T1 via [gcode_button] = Klipper's buttons module, which polls on a fixed
#       interval WITH software debounce.
#   Any bounce or noise on T0's output near its threshold is therefore caught
#   stochastically, while T1's is filtered out. That alone can produce ~1-step
#   (0.02 mm) scatter on T0 with no mechanical cause whatsoever — which matches
#   the observed pattern (T1 exactly repeatable, T0 bouncing +-0.02).
#   Discriminator: PROBE_ACCURACY uses Klipper's hardware-timed trigger path
#   (not polling) — if it still returns the bring-up figures (~0.005 range),
#   T0's sensor is fine and the scatter is this macro's sampling method.
# ⚠ BED_MESH_CLEAR is deliberate: the two phases sit at different CARRIAGE X
#   (290 vs 237.75), so an active mesh would apply different compensation to
#   each and bias the delta. The mesh is reloaded at the end.
[gcode_macro _MLD]
variable_active: 0
variable_phase: ""
variable_t0z: 99.0
variable_t1z: 99.0
gcode:
    RESPOND MSG="_MLD is a state holder"

[gcode_macro MEASURE_LOCKED_DELTA]
description: Measure BOTH tips in LOCKED (printing) posture with their own sensors; reports the true tool delta
gcode:
    {% set th = printer['gcode_macro _TH'] %}
    {% if "xyz" not in printer.toolhead.homed_axes %}
        RESPOND TYPE=error MSG="MEASURE_LOCKED_DELTA: G28 first"
    {% elif printer.gcode_move.homing_origin.x|abs > 0.01 %}
        RESPOND TYPE=error MSG="MEASURE_LOCKED_DELTA: a tool offset is active - run T0 first"
    {% elif printer['gcode_button t1_probe'].state|upper == "PRESSED" %}
        RESPOND TYPE=error MSG="MEASURE_LOCKED_DELTA: T1 sensor already triggered at rest - check polarity / reference"
    {% else %}
        SET_GCODE_VARIABLE MACRO=_MLD VARIABLE=t0z VALUE=99.0
        SET_GCODE_VARIABLE MACRO=_MLD VARIABLE=t1z VALUE=99.0
        BED_MESH_CLEAR
        G90
        G1 Z5 F198
        G1 X290 Y310 F6000          ; T0 tip over the vendor probe point
        ; T1 clear at its midpoint, UNPOWERED — an energized servo dithers and
        ; that vibration reaches the other head's sensor (root-caused 2026-08-17)
        RELEASE_HEAD T=1
        SET_SERVO SERVO=head1_lift WIDTH=0
        ; T0: crisp wake-lift (sensor reference) then snap to LOCKED posture.
        ; No glides near a measurement — the sensor re-references mid-ramp.
        SET_SERVO SERVO=head0_lift WIDTH={th.t0_up}
        G4 P400
        SET_SERVO SERVO=head0_lift WIDTH={th.t0_down}
        G4 P500
        SET_GCODE_VARIABLE MACRO=_TH VARIABLE=t0_pos VALUE={th.t0_down}
        G1 Z0.8 F198
        QUERY_PROBE
        SET_GCODE_VARIABLE MACRO=_MLD VARIABLE=phase VALUE="'t0'"
        SET_GCODE_VARIABLE MACRO=_MLD VARIABLE=active VALUE=1
        UPDATE_DELAYED_GCODE ID=_mld_tick DURATION=2
        RESPOND MSG="Phase 1/2: measuring T0 tip in LOCKED posture..."
    {% endif %}

[delayed_gcode _mld_tick]
gcode:
    {% if printer['gcode_macro _MLD'].active == 1 %}
        {% set st = printer['gcode_macro _MLD'] %}
        {% set th = printer['gcode_macro _TH'] %}
        {% set z = printer.toolhead.position.z %}
        {% if st.phase == 't0' %}
            {% if printer.probe.last_query %}
                {% if z > 0.7 %}
                    SET_GCODE_VARIABLE MACRO=_MLD VARIABLE=active VALUE=0
                    RESPOND TYPE=error MSG="MEASURE_LOCKED_DELTA: T0 sensor read TRIGGERED at the start height - aborted (stale reference; re-run)"
                    G90
                    G1 Z5 F198
                {% else %}
                    ; --- T0 captured; set up phase 2 -------------------------
                    SET_GCODE_VARIABLE MACRO=_MLD VARIABLE=t0z VALUE={z|round(4)}
                    RESPOND MSG="T0 tip (locked) contact at Z {z|round(3)} — phase 2/2: T1..."
                    G90
                    G1 Z5 F198
                    G1 X237.75 Y310 F6000   ; T1 tip over the SAME bed point (290 - 52.25)
                    ; T0 clear at mid, unpowered — same reason as above
                    RELEASE_HEAD T=0
                    SET_SERVO SERVO=head0_lift WIDTH=0
                    ; T1: crisp wake-lift then snap to its LOCKED posture
                    SET_SERVO SERVO=head1_lift WIDTH={th.t1_up}
                    G4 P400
                    SET_SERVO SERVO=head1_lift WIDTH={th.t1_down}
                    G4 P500
                    SET_GCODE_VARIABLE MACRO=_TH VARIABLE=t1_pos VALUE={th.t1_down}
                    G1 Z0.8 F198
                    SET_GCODE_VARIABLE MACRO=_MLD VARIABLE=phase VALUE="'t1'"
                    UPDATE_DELAYED_GCODE ID=_mld_tick DURATION=1.5
                {% endif %}
            {% elif z <= -1.0 %}
                SET_GCODE_VARIABLE MACRO=_MLD VARIABLE=active VALUE=0
                RESPOND TYPE=error MSG="MEASURE_LOCKED_DELTA: no T0 contact by Z-1.0 - aborted; check the probe sensor"
                G90
                G1 Z5 F198
            {% else %}
                G91
                G1 Z-0.02 F60
                G90
                ; ⚠ SETTLE BEFORE SAMPLING (2026-08-18). QUERY_PROBE takes ONE
                ; instantaneous sample at the end of the queued move — i.e. the
                ; instant motion stops. T1's [gcode_button] is instead read at
                ; the START of the next tick, a full 0.15 s after its move, so
                ; it always sees a settled sensor. On motion-sensing contact
                ; sensors that difference is real, and it is the leading
                ; explanation for T0 scattering +-0.02 while T1 repeats exactly
                ; (PROBE_ACCURACY proved the hardware itself is 0.003-0.006).
                ; This dwell settle-matches T0's sample to T1's.
                G4 P150
                QUERY_PROBE
                UPDATE_DELAYED_GCODE ID=_mld_tick DURATION=0.15
            {% endif %}
        {% else %}
            {% if printer['gcode_button t1_probe'].state|upper == "PRESSED" %}
                SET_GCODE_VARIABLE MACRO=_MLD VARIABLE=active VALUE=0
                SET_GCODE_VARIABLE MACRO=_MLD VARIABLE=t1z VALUE={z|round(4)}
                RESPOND MSG="T1 tip (locked) contact at Z {z|round(3)}"
                RESPOND MSG="LOCKED-POSTURE TOOL DELTA = {(z - st.t0z)|round(3)} mm  (T0 {st.t0z|round(3)} -> T1 {z|round(3)}).  Negative = T1 sits HIGHER. Apply with: SET_RIGHT_Z VALUE={(z - st.t0z)|round(3)}"
                G90
                G1 Z5 F198
                RELEASE_HEAD T=1
                SET_SERVO SERVO=head1_lift WIDTH=0
                {% if 'default' in printer.bed_mesh.profiles %}
                    BED_MESH_PROFILE LOAD=default
                {% endif %}
            {% elif z <= -1.6 %}
                SET_GCODE_VARIABLE MACRO=_MLD VARIABLE=active VALUE=0
                RESPOND TYPE=error MSG="MEASURE_LOCKED_DELTA: no T1 contact by Z-1.6 - aborted (T0-at-midpoint clearance limits how far this can go)"
                G90
                G1 Z5 F198
                RELEASE_HEAD T=1
                SET_SERVO SERVO=head1_lift WIDTH=0
                {% if 'default' in printer.bed_mesh.profiles %}
                    BED_MESH_PROFILE LOAD=default
                {% endif %}
            {% else %}
                G91
                G1 Z-0.02 F60
                G90
                UPDATE_DELAYED_GCODE ID=_mld_tick DURATION=0.15
            {% endif %}
        {% endif %}
    {% endif %}


# ---------- Locked-posture probing via Klipper's NATIVE probe (2026-08-18) ----
# Same measurement MEASURE_LOCKED_DELTA's phase 1 makes, but done by Klipper's
# real probe path instead of a stepped poll. Three advantages that matter:
#   * SYNCHRONOUS — safe to call from PRINT_START (the stepped-poll macros are
#     asynchronous delayed_gcodes and are NOT).
#   * HARDWARE-TIMED trigger, not a 0.02 mm software step — PROBE_ACCURACY in
#     probe posture returns ~0.003-0.006 mm range on this machine.
#   * Multi-sample with median + tolerance retries, for free.
# Result lands in printer.probe.last_z_result.
# ⚠⚠ VERDICT 2026-08-18 — DO NOT USE THESE PER PRINT. Measured head-to-head:
#       probe posture (1.080):  range 0.0032 / 0.0057   stddev 0.0009 / 0.0017
#       LOCKED posture (1.050): range 0.0179            stddev 0.0062
#   Locked is 3-7x LESS repeatable, and its settling curve does not plateau
#   within 10 samples (-0.0714 -> -0.0894, ~0.018 mm of progressive seating vs
#   ~0.003 mm in probe posture). The harder engagement strains and re-seats the
#   linkage on every touch. The vendor's separate, gentler probe posture is
#   vindicated: keep homing and meshing on it, and carry the posture gap as the
#   stored constant it already is (the paper-calibrated z_offset, taken with T0
#   LOCKED by the PROBE_CALIBRATE wrapper). Kept below for diagnostics only.
[gcode_macro PROBE_LOCKED]
description: DIAGNOSTIC ONLY (locked posture probes 3-7x worse — see verdict above)
gcode:
    SET_GCODE_VARIABLE MACRO=_PROBE_CFG VARIABLE=locked VALUE=1
    PROBE {rawparams}

[gcode_macro PROBE_ACCURACY_LOCKED]
description: PROBE_ACCURACY in LOCKED (printing) posture — compare against the probe-posture run
gcode:
    SET_GCODE_VARIABLE MACRO=_PROBE_CFG VARIABLE=locked VALUE=1
    PROBE_ACCURACY {rawparams}
