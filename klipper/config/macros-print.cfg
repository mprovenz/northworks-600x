# =============================================================================
#  STAGE 6 — print start/end and operator macros.
#
#  PRINT_START mirrors the vendor's proven Simplify3D start sequence, with the
#  two bugs fixed that were found in their own output (bed never heated because
#  [bed0_temperature] resolved to -1; M106 S319 out of range).
#
#  Slicer contract — the OrcaSlicer profiles must be changed to call these
#  instead of emitting the raw Smoothieware sequence. See slicer/README.md.
# =============================================================================

# Safety net: auto-load the saved mesh at Klipper startup, so even a G-code
# file with a legacy (Smoothieware-era) preamble prints with compensation.
# PRINT_START still does its own explicit CLEAR + LOAD.
[delayed_gcode _load_default_mesh]
initial_duration: 2
gcode:
    {% if printer.bed_mesh is defined and 'default' in printer.bed_mesh.profiles %}
        BED_MESH_PROFILE LOAD=default
        RESPOND MSG="Loaded bed mesh profile 'default'"
    {% endif %}

[gcode_macro PRINT_START]
description: PRINT_START EXTRUDER=<c> BED=<c> TOOL=<0|1> [CHAMBER=<c>]
gcode:
    {% set e     = params.EXTRUDER|default(220)|float %}
    {% set bed   = params.BED|default(60)|float %}
    {% set tool  = params.TOOL|default(0)|int %}
    {% set cham  = params.CHAMBER|default(0)|float %}

    RESPOND MSG="Start: T{tool} nozzle {e}C bed {bed}C"
    CLEAR_PAUSE
    G90
    M83                                     # relative E — verified working on this machine
    G92 E0

    {% if cham > 0 %}CABINET_ON{% endif %}

    # --- heat: bed first, then soak the nozzle while homing ---
    M140 S{bed}
    M104 S{e} T{tool}
    M190 S{bed}

    # --- clear the bed before homing (vendor did G91/G0 Z10/G90) ---
    # Guarded (2026-08-17): after PRINT_END's M84 the axes are UNHOMED, and an
    # unhomed relative move is a Klipper error — this hop used to abort every
    # reprint until the operator homed manually (and then the G28 below ran
    # again: the "double home"). When unhomed, skip straight to G28 —
    # safe_z_home's own 5 mm z_hop covers the nozzle-clearance concern.
    {% if "z" in printer.toolhead.homed_axes %}
        G91
        G1 Z10 F198
        G90
    {% endif %}
    G28

    # --- probe and mesh ---
    # Vendor ran G30.1 (probe, reset Z) on every print. Klipper's equivalent is
    # a mesh load or calibrate. Prefer a stored mesh; the bed spans ~2 mm so a
    # per-print calibrate is slow but defensible on a machine this size.
    BED_MESH_CLEAR
    {% if printer.bed_mesh is defined and 'default' in printer.bed_mesh.profiles %}
        BED_MESH_PROFILE LOAD=default
    {% else %}
        RESPOND TYPE=error MSG="No saved mesh 'default' — run BED_MESH_CALIBRATE once, then SAVE_CONFIG"
    {% endif %}

    # --- engage the right head ---
    T{tool}

    # --- final soak at temperature, then go ---
    M109 S{e} T{tool}
    G92 E0

[gcode_macro PRINT_END]
description: End of print — mirrors the vendor's end G-code plus a park
gcode:
    M400
    TURN_OFF_HEATERS
    M107
    G91
    G1 Z10 F198
    G90
    PARK
    # Vendor left the cabinet running; turn it off explicitly.
    CABINET_OFF
    # Rest posture (operator request 2026-08-17): both heads to the released
    # midpoint — the vendor's service position — then power off the servos.
    # NB unpowered heads can drift from the midpoint (T1 especially); the
    # position tracker is reset by SERVOS_OFF so the next move self-recovers.
    RELEASE_HEAD T=0
    RELEASE_HEAD T=1
    SERVOS_OFF
    M84
    RESPOND MSG="Print complete"

# ---------- Operator macros (the old NWTools Tools tab) -----------------------
# PARK / PAUSE / RESUME / CANCEL_PRINT live in macros-client.cfg (always
# included — Fluidd requires them to exist from stage 1).

[gcode_macro UNLOAD_PRINT]
description: Drop the bed to remove the part (the vendor's G0 Z250)
gcode:
    G90
    G1 Z250 F198                    # ~75 s at the 200 mm/min ceiling — this is normal

# Filament handling posture (operator request 2026-08-17): the TARGET head is
# LIFTED — nozzle visible and purged filament easy to clean up — and the other
# head goes to the released midpoint. NB this deliberately does NOT run the
# full T{t} toolchange (no lock, no offsets): only the extruder motor is
# activated for the E moves. PRINT_START / T-change restores print posture.
[gcode_macro LOAD_FILAMENT]
description: LOAD_FILAMENT T=0|1 — lifts the head, heats, feeds until purged
gcode:
    {% set t = params.T|default(0)|int %}
    ACTIVATE_EXTRUDER EXTRUDER={'extruder' if t == 0 else 'extruder1'}
    LIFT_HEAD T={t}                 # target head up and HOLDING for access
    RELEASE_HEAD T={1 - t}          # idle head to neutral midpoint
    M109 S220 T{t}
    M83
    G1 E80 F150                     # 2.5 mm/s — slowed 2026-08-14 (vendor fed at ~1.7 mm/s)
    G1 E40 F100
    RESPOND MSG="Purge until clean, then run UNLOAD_FILAMENT or start a print"

[gcode_macro UNLOAD_FILAMENT]
description: UNLOAD_FILAMENT T=0|1 — lifts the head, heats, retracts out
gcode:
    {% set t = params.T|default(0)|int %}
    ACTIVATE_EXTRUDER EXTRUDER={'extruder' if t == 0 else 'extruder1'}
    LIFT_HEAD T={t}
    RELEASE_HEAD T={1 - t}
    M109 S220 T{t}
    M83
    G1 E5 F100                      # vendor pushed forward first to shear the blob
    G1 E-100 F150                   # 2.5 mm/s — slowed 2026-08-14
    M104 S0 T{t}

[gcode_macro REBOOT_CONTROLLER]
description: Placeholder — the vendor pulsed Pi GPIO 24 (jreset)
gcode:
    RESPOND TYPE=error MSG="Not available from Klipper: GPIO 24 resets the MCU Klipper talks to. Use the host-side jreset script, then FIRMWARE_RESTART."

# Pause / resume / cancel: see macros-client.cfg (always included).
