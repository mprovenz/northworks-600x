# =============================================================================
#  STAGE 4 — dual lifting heads: servos, T0/T1, tool offsets.
#
#  This replaces the vendor's M672 / M506 / M673 entirely.
#
#  SERVO VALUES ARE DERIVED, NOT GUESSED — the conversion is exact.
#     The servos are Spektrum S6280 (standard digital surface servo, HV
#     6-8.4 V, 26-36 kg-cm). Smoothieware's M280 S<v> values are DUTY-CYCLE
#     PERCENT of its hwpwm frame, which defaults to 20 ms (50 Hz) — and
#     Klipper's [servo] uses the same fixed 20 ms frame. Therefore:
#         pulse width = duty% x 20 ms   (e.g. 7.15 -> 1.430 ms)
#     The macros below command SET_SERVO WIDTH= with those exact widths, so
#     the servos receive bit-identical pulses to the vendor firmware.
#     PREFLIGHT.md §3 lists the one-time confirmation to run with the heads
#     clear of the bed before trusting them over glass.
#
#  CAM: resolved 2026-08-13 — M676/M518 produced no observable action on this
#     machine; treated as vestigial (shared vendor firmware). See PREFLIGHT §1.
#     If head engagement ever misbehaves, re-check that conclusion first.
# =============================================================================

# ---------- Servos ------------------------------------------------------------
# NO initial_angle / initial_pulse_width on either servo — deliberately. Unset,
# Klipper leaves the servo UNDRIVEN at startup, which is exactly the vendor's
# resting state (they sent M281 = servo off after every move; a digital servo
# simply holds by friction). initial_angle: 0 would be actively dangerous: it
# slams the servo to an endpoint of unknown physical meaning on every restart.
#
# min/max pulse width act as CLAMPS on SET_SERVO WIDTH (WIDTH=0 = off always
# works). Bounds chosen to bracket the vendor's working extremes — 1.050 ms
# (T0 locked) to 1.920 ms (T1 probe deploy) — with a little margin, so a typo
# in _TH cannot overdrive the linkage.
[servo head0_lift]
pin: P3.25                          # switch.servo, hwpwm — Spektrum S6280
minimum_pulse_width: 0.0009
maximum_pulse_width: 0.00195

[servo head1_lift]
pin: P1.23                          # switch.servo2, hwpwm (M280.1) — Spektrum S6280
minimum_pulse_width: 0.0009
maximum_pulse_width: 0.00195

# ---------- Calibration constants --------------------------------------------
# One place to hold every measured value, so the macros stay readable and there
# is exactly one thing to edit after calibration.
[gcode_macro _TH]
description: Toolhead constants — pulse widths in SECONDS (duty% x 20 ms)
variable_t0_up:         0.001430    # M673 A 7.150%  — T0 raised
variable_t0_down:       0.001050    # M673 B 5.250%  — T0 locked
variable_t1_up:         0.001450    # M673 C 7.250%  — T1 raised
variable_t1_down:       0.001815    # CONFIRMED live 2026-08-13: M503 -> M673 D 9.0750 (1.815 ms;
                                    #   the card's 9.200 was stale)
# Probe deploy/stow are DIFFERENT from lock/raise — the vendor used slightly
# different positions for probing (zprobe.probe_up/down). Kept faithful:
variable_t0_probe_up:   0.001480    # zprobe.probe_up   7.4%
variable_t0_probe_down: 0.001080    # zprobe.probe_down 5.4%
variable_t1_probe_up:   0.001440    # zprobe.probe2_up  7.2%  (T1 sensor postures —
variable_t1_probe_down: 0.001920    # zprobe.probe2_down 9.6%  used by MEASURE_TIP_DELTA)
# T1 sensor cross-calibration for the PROBE-POSTURE macro (MEASURE_TIP_DELTA).
# RE-DERIVED 2026-08-18 against MEASURE_LOCKED_DELTA, which measures both tips
# in their LOCKED (printing) postures and is now the authority:
#     locked truth -0.34  -  probe-posture raw -0.99  =  +0.65
# The old +1.100 came from a paper test taken in an unenforced T1 posture, and
# it is what pushed t1_z to the vendor-like +0.37 that under-extruded all week.
# ⚠ MEASURE_TIP_DELTA is now the INFERIOR tool: its raw readings spread 0.36 mm
#   across three runs (-1.069 / -0.709 / -0.99) where MEASURE_LOCKED_DELTA's T1
#   phase repeated -0.92 exactly three times. Prefer MEASURE_LOCKED_DELTA.
variable_t1_sensor_cal: 0.650
# ⚠ T1's mechanical sense is REVERSED relative to T0: "locked" is a LONGER
#   pulse than "raised" (1.450 raised < 1.815 locked; likewise probe2_up
#   1.440 < probe2_down 1.920). Expected — do not "fix" it.
variable_settle_ms: 500             # servos are slow; give them time
# Which tool's Z component is currently inside the gcode offset. Tool changes
# apply Z as a DELTA (Z_ADJUST) against this, so operator babysteps SURVIVE
# tool changes (2026-08-17 — absolute Z= was wiping them).
# ⚠ Consequence: run Z_OFFSET_APPLY_PROBE only with T0 active, or the tool
# component gets folded into the probe z_offset.
variable_tool_z_applied: 0.0
# Motion character (added 2026-08-14 to match the vendor's gentler feel):
# every tracked move is ONE continuous micro-stepped glide from the current
# width to the target. Because the release midpoint lies numerically BETWEEN
# up and down on both heads, a lift<->lock glide inherently travels through
# neutral — there is no separate dwell there. The midpoint-FIRST step (with
# the phase_ms dwell) exists only as the unknown-position fallback, where a
# glide is impossible because there is no known starting width. Tune:
variable_phase_ms:  250             # dwell at the midpoint (unknown-position fallback only)
variable_ramp_steps: 20             # more steps = smoother
variable_ramp_ms:   40              # ms per step; full-travel glide = steps x this (~0.8 s)
# Last COMMANDED width per head, so moves glide from where the head actually is
# instead of jumping (the jump was the audible "slam" — 2026-08-15). -1 =
# unknown (after restart, or after SERVOS_OFF releases a lifted head): the next
# move then falls back to vendor-style midpoint-first.
variable_t0_pos:    -1.0
variable_t1_pos:    -1.0
# T1 offsets. X is authoritative (M675.1 X-52.25); Z must be measured — see
# hardware-probe.cfg. The FIRMWARE used to apply these; now we do, so the
# slicer must keep extruder_offset at 0.
variable_t1_x:      -52.25
variable_t1_y:      0.0
variable_t1_z:      -0.34           # MEASURED 2026-08-18 by MEASURE_LOCKED_DELTA (mean of 3)
                                    #   (live M503: M670 O-0.52 / Q-0.15 -> delta +0.37) after
                                    #   T1 under-extrusion with the measured value; operator not
                                    #   confident in that calibration. For the record:
                                    #     paper measurement 2026-08-17:  +0.031
                                    #     vendor card-era (2021 dump):   ~+0.06
                                    #     vendor live at decommission:   +0.37  <- current
                                    #   Best future path: live-tune during a T1 section (babysteps
                                    #   now SURVIVE tool changes), read the correction off the
                                    #   Tune panel, fold it in here.
gcode:
    # constants holder only — never called
    RESPOND MSG="_TH is a constants holder"

# ---------- Primitives --------------------------------------------------------
[gcode_macro _SERVO_RAMP]
description: Internal — glide a servo between two known widths in small steps
gcode:
    {% set th = printer['gcode_macro _TH'] %}
    {% set frm = params.FROM|float %}
    {% set to = params.TO|float %}
    {% set n = th.ramp_steps|int %}
    {% for i in range(1, n + 1) %}
        SET_SERVO SERVO={params.SERVO} WIDTH={frm + (to - frm) * i / n}
        G4 P{th.ramp_ms}
    {% endfor %}

[gcode_macro _HEAD_MOVE]
description: Internal — glide a head to a target width from its tracked position
gcode:
    {% set t = params.T|int %}
    {% set target = params.TARGET|float %}
    {% set th = printer['gcode_macro _TH'] %}
    {% set servo = 'head0_lift' if t == 0 else 'head1_lift' %}
    {% set cur = th.t0_pos if t == 0 else th.t1_pos %}
    {% if cur >= 0 and (cur - target)|abs < 0.00001 %}
        ; already there and holding — no-op (lets the probe re-assert T1's
        ; lift on every mesh point for free)
    {% elif cur < 0 %}
        ; position unknown (restart / after SERVOS_OFF): vendor-style midpoint
        ; first, then glide the remainder
        {% set mid = (th.t0_up + th.t0_down) / 2 if t == 0 else (th.t1_up + th.t1_down) / 2 %}
        SET_SERVO SERVO={servo} WIDTH={mid}
        G4 P{th.phase_ms}
        _SERVO_RAMP SERVO={servo} FROM={mid} TO={target}
    {% else %}
        _SERVO_RAMP SERVO={servo} FROM={cur} TO={target}
    {% endif %}
    SET_GCODE_VARIABLE MACRO=_TH VARIABLE=t{t}_pos VALUE={target}
    G4 P{th.settle_ms}

[gcode_macro LIFT_HEAD]
description: Raise a head clear of the part.  LIFT_HEAD T=0|1
gcode:
    {% set t = params.T|default(0)|int %}
    {% set th = printer['gcode_macro _TH'] %}
    _HEAD_MOVE T={t} TARGET={th.t0_up if t == 0 else th.t1_up}

[gcode_macro LOCK_HEAD]
description: Lower and engage a head.  LOCK_HEAD T=0|1
gcode:
    {% set t = params.T|default(0)|int %}
    {% set th = printer['gcode_macro _TH'] %}
    _HEAD_MOVE T={t} TARGET={th.t0_down if t == 0 else th.t1_down}

[gcode_macro RELEASE_HEAD]
description: Park a head mid-travel (the vendor's M672 P0 — the midpoint of
             raised and locked; the T0 midpoint 1.240 ms equals the 6.2% duty
             observed live, which corroborates the whole conversion)
gcode:
    {% set t = params.T|default(0)|int %}
    {% set th = printer['gcode_macro _TH'] %}
    _HEAD_MOVE T={t} TARGET={(th.t0_up + th.t0_down) / 2 if t == 0 else (th.t1_up + th.t1_down) / 2}

[gcode_macro SERVOS_OFF]
description: Stop driving both servos. NB an unpowered LIFTED head falls (T1
             especially — confirmed 2026-08-15), so positions become UNKNOWN:
             tracking resets and the next move uses the midpoint-first fallback.
gcode:
    SET_SERVO SERVO=head0_lift WIDTH=0
    SET_SERVO SERVO=head1_lift WIDTH=0
    SET_GCODE_VARIABLE MACRO=_TH VARIABLE=t0_pos VALUE=-1.0
    SET_GCODE_VARIABLE MACRO=_TH VARIABLE=t1_pos VALUE=-1.0

# ---------- Tool change -------------------------------------------------------
# Mirrors the vendor sequence exactly:
#   G91 / G0 Z2 / G90 -> lift idle head -> lock active head -> apply offset
#
# ⚠ SET_GCODE_OFFSET must come AFTER RESTORE_GCODE_STATE. The saved g-code state
#   includes the current offset, so restoring it would silently wipe an offset
#   applied inside the save/restore bracket — T1 would print without its
#   -52.25 mm X shift, and switching back to T0 would RESURRECT it.
[gcode_macro T0]
description: Select tool 0
gcode:
    SAVE_GCODE_STATE NAME=toolchange
    G91
    G1 Z2 F198                      # 200 mm/min ceiling
    G90
    LIFT_HEAD T=1                   ; idle head UP — servo stays driven (anti-sag)
    LOCK_HEAD T=0                   ; active head DOWN — servo ALSO stays driven:
                                    ;   unpowered lock proved marginal (T0's lift LED
                                    ;   flickered under printing forces, 2026-08-17).
                                    ;   Both working postures held, like the vendor;
                                    ;   release only at the midpoint (G28/PRINT_END).
    RESTORE_GCODE_STATE NAME=toolchange
    SET_GCODE_OFFSET X=0 Y=0 MOVE=0
    SET_GCODE_OFFSET Z_ADJUST={0 - printer['gcode_macro _TH'].tool_z_applied} MOVE=0
    SET_GCODE_VARIABLE MACRO=_TH VARIABLE=tool_z_applied VALUE=0
    ACTIVATE_EXTRUDER EXTRUDER=extruder

[gcode_macro T1]
description: Select tool 1
gcode:
    {% set th = printer['gcode_macro _TH'] %}
    SAVE_GCODE_STATE NAME=toolchange
    G91
    G1 Z2 F198
    G90
    LIFT_HEAD T=0                   ; idle head UP — servo stays driven (anti-sag)
    LOCK_HEAD T=1                   ; active head held too — see T0 macro note
    RESTORE_GCODE_STATE NAME=toolchange
    SET_GCODE_OFFSET X={th.t1_x} Y={th.t1_y} MOVE=0
    SET_GCODE_OFFSET Z_ADJUST={th.t1_z - th.tool_z_applied} MOVE=0
    SET_GCODE_VARIABLE MACRO=_TH VARIABLE=tool_z_applied VALUE={th.t1_z}
    ACTIVATE_EXTRUDER EXTRUDER=extruder1

# ---------- The CAM — RESOLVED AS VESTIGIAL (2026-08-13) ----------------------
# "Test CAM" (M676) and ">> CAM" (M518 E5) were tested on the working machine:
# commands acknowledged, nothing moved. The firmware is a shared vendor build,
# so the CAM code is most likely for different hardware. No macro needed.
# If head engagement ever misbehaves under Klipper, revisit PREFLIGHT §1 before
# blaming the servo widths.

# ---------- Live RIGHT-head Z trim (2026-08-18) -------------------------------
# Nudge T1's height RELATIVE to T0, mid-print, without disturbing T0.
#
# ⚠ Why a macro and not a plain babystep: since 2026-08-17 operator babysteps
#   SURVIVE tool changes (they are a single global gcode offset). So a raw
#   SET_GCODE_OFFSET during a T1 section also shifts T0 when the job switches
#   back. To keep a correction attached to the RIGHT head only, the same delta
#   must be folded into _TH t1_z AND tool_z_applied, so the next T0 selection
#   removes it again. That is exactly what this does, atomically.
#
# NB name has NO DIGITS on purpose — a digit terminates an extended command
# name in Klipper's parser (MEASURE_T1_OFFSET was truncated to MEASURE_T1).
[gcode_macro NUDGE_RIGHT_Z]
description: NUDGE_RIGHT_Z DELTA=-0.02 — trim RIGHT head (T1) height vs LEFT; negative = closer to bed
gcode:
    {% set d = params.DELTA|default(-0.02)|float %}
    {% set th = printer['gcode_macro _TH'] %}
    {% if printer.toolhead.extruder != 'extruder1' %}
        RESPOND TYPE=error MSG="NUDGE_RIGHT_Z: the RIGHT head is not active — run this during a T1 section"
    {% elif "z" not in printer.toolhead.homed_axes %}
        RESPOND TYPE=error MSG="NUDGE_RIGHT_Z: Z not homed"
    {% elif d|abs > 0.2 %}
        RESPOND TYPE=error MSG="NUDGE_RIGHT_Z: DELTA {d} too big for one step — use 0.02–0.05"
    {% else %}
        {% set new = (th.t1_z + d)|round(4) %}
        SET_GCODE_OFFSET Z_ADJUST={d} MOVE=1
        SET_GCODE_VARIABLE MACRO=_TH VARIABLE=t1_z VALUE={new}
        SET_GCODE_VARIABLE MACRO=_TH VARIABLE=tool_z_applied VALUE={new}
        RESPOND MSG="RIGHT head Z {d} mm — t1_z now {new} (SESSION ONLY: persist variable_t1_z in macros-toolhead.cfg when the value is proven)"
    {% endif %}

[gcode_macro SHOW_TOOL_Z]
description: Report the live RIGHT-head Z delta and what is currently inside the gcode offset
gcode:
    {% set th = printer['gcode_macro _TH'] %}
    RESPOND MSG="t1_z={th.t1_z} · tool_z_applied={th.tool_z_applied} · live gcode Z offset={printer.gcode_move.homing_origin.z|round(4)} · active={printer.toolhead.extruder}"

# ---------- Persistent RIGHT-head Z delta (2026-08-18) ------------------------
# Iterating t1_z between prints, without editing a file + RESTART each round.
# SAVE_VARIABLE writes to the file below (Klipper rewrites it live; it is NOT
# the SAVE_CONFIG autosave block and does not need a restart), and the startup
# loader re-applies it to _TH on every boot. So the loop is:
#     SET_RIGHT_Z DELTA=-0.03   ->   slice/start the next print   ->   judge
# ⚠ ONE-TIME CHECK before deploying: the machine must not already declare
#   [save_variables] elsewhere (duplicate section = config error):
#       grep -rn "save_variables" ~/printer_data/config/
#   If one exists, delete the block below and keep the existing filename.
[save_variables]
filename: ~/printer_data/config/saved_variables.cfg

[delayed_gcode _load_saved_tool_z]
initial_duration: 3
gcode:
    {% set sv = printer.save_variables.variables %}
    {% if 't1_z' in sv %}
        SET_GCODE_VARIABLE MACRO=_TH VARIABLE=t1_z VALUE={sv.t1_z}
        RESPOND MSG="RIGHT head Z delta restored from saved variables: {sv.t1_z} mm"
    {% endif %}

[gcode_macro SET_RIGHT_Z]
description: SET_RIGHT_Z DELTA=-0.03 | VALUE=0.30 — set the RIGHT head (T1) Z delta; persists across restarts
gcode:
    {% set th = printer['gcode_macro _TH'] %}
    {% if params.VALUE is not defined and params.DELTA is not defined %}
        RESPOND TYPE=error MSG="SET_RIGHT_Z: give DELTA=<+/-mm> (relative) or VALUE=<mm> (absolute). Current t1_z = {th.t1_z}"
    {% else %}
        {% set v = (params.VALUE|float if params.VALUE is defined
                    else th.t1_z + params.DELTA|float)|round(4) %}
        {% if v < -1.0 or v > 1.0 %}
            RESPOND TYPE=error MSG="SET_RIGHT_Z: {v} mm is outside the sane -1..+1 band — refusing"
        {% else %}
            SAVE_VARIABLE VARIABLE=t1_z VALUE={v}
            SET_GCODE_VARIABLE MACRO=_TH VARIABLE=t1_z VALUE={v}
            ; if the RIGHT head is live RIGHT NOW, move the running offset too so
            ; the change takes effect immediately instead of at the next T1
            {% if printer.toolhead.extruder == 'extruder1' %}
                SET_GCODE_OFFSET Z_ADJUST={(v - th.tool_z_applied)|round(4)} MOVE=0
                SET_GCODE_VARIABLE MACRO=_TH VARIABLE=tool_z_applied VALUE={v}
                RESPOND MSG="RIGHT head Z delta = {v} mm — SAVED and applied live (RIGHT is active)"
            {% else %}
                RESPOND MSG="RIGHT head Z delta = {v} mm — SAVED; takes effect at the next T1 / print start"
            {% endif %}
        {% endif %}
    {% endif %}
