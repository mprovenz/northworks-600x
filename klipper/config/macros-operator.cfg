# =============================================================================
#  Operator "functions page" — the old NWTools Tools tab as one-tap buttons.
#
#  ORIENTATION (confirmed by operator 2026-08-14):
#      T0 = LEFT head      T1 = RIGHT head   (T1 carries the -52.25 mm X offset)
#  Operator-facing names use LEFT/RIGHT; the machine layer (T0/T1 macros,
#  [extruder]/[extruder1] — names Klipper hard-codes) keeps tool numbering.
#
#  Suggested grouping (Fluidd: Settings -> Macros -> categories):
#    Heads:    LIFT_HEAD_LEFT/RIGHT · LOCK_HEAD_LEFT/RIGHT ·
#              RELEASE_HEAD_LEFT/RIGHT · RELEASE_HEADS · SERVOS_OFF
#  NB (2026-08-17): lift/lock buttons LEAVE THE SERVO HOLDING — the linkage's
#  only unpowered-stable pose is the released midpoint, so an off-after-move
#  just lets the head fall back (this was the "releases back" bug). Use
#  RELEASE_HEADS (or SERVOS_OFF) to relax the mechanism when done.
#    Filament: LOAD_FILAMENT_LEFT/RIGHT · UNLOAD_FILAMENT_LEFT/RIGHT
#    Machine:  PARK · UNLOAD_PRINT · PREHEAT_PLA · COOLDOWN ·
#              LIGHTS_ON/OFF · CABINET_ON/OFF
# =============================================================================

# ---------- Heads --------------------------------------------------------------
[gcode_macro LIFT_HEAD_LEFT]
description: Raise the LEFT printhead (T0) — glides, then HOLDS (servo stays on)
gcode:
    LIFT_HEAD T=0

[gcode_macro LOCK_HEAD_LEFT]
description: Lower and engage the LEFT printhead (T0) — holds until released
gcode:
    LOCK_HEAD T=0

[gcode_macro LIFT_HEAD_RIGHT]
description: Raise the RIGHT printhead (T1) — glides, then HOLDS (servo stays on)
gcode:
    LIFT_HEAD T=1

[gcode_macro LOCK_HEAD_RIGHT]
description: Lower and engage the RIGHT printhead (T1) — holds until released
gcode:
    LOCK_HEAD T=1

[gcode_macro RELEASE_HEAD_LEFT]
description: LEFT printhead (T0) to the release midpoint, then its servo off
             (mid is the linkage's unpowered-stable pose, so off is safe here)
gcode:
    RELEASE_HEAD T=0
    SET_SERVO SERVO=head0_lift WIDTH=0

[gcode_macro RELEASE_HEAD_RIGHT]
description: RIGHT printhead (T1) to the release midpoint, then its servo off
gcode:
    RELEASE_HEAD T=1
    SET_SERVO SERVO=head1_lift WIDTH=0

[gcode_macro RELEASE_HEADS]
description: Both heads to the release midpoint, servos off
gcode:
    RELEASE_HEAD_LEFT
    RELEASE_HEAD_RIGHT

# ---------- Filament -----------------------------------------------------------
[gcode_macro LOAD_FILAMENT_LEFT]
description: Heat the LEFT head (T0) and feed filament — purge until clean
gcode:
    LOAD_FILAMENT T=0

[gcode_macro LOAD_FILAMENT_RIGHT]
description: Heat the RIGHT head (T1) and feed filament
gcode:
    LOAD_FILAMENT T=1

[gcode_macro UNLOAD_FILAMENT_LEFT]
description: Heat the LEFT head (T0), shear the blob and retract filament out
gcode:
    UNLOAD_FILAMENT T=0

[gcode_macro UNLOAD_FILAMENT_RIGHT]
description: Heat the RIGHT head (T1) and retract filament out
gcode:
    UNLOAD_FILAMENT T=1

# ---------- Machine ------------------------------------------------------------
[gcode_macro PREHEAT_PLA]
description: Bed 60 / LEFT head (T0) 205 — no wait; COOLDOWN cancels
gcode:
    M140 S60
    M104 S205 T0

[gcode_macro COOLDOWN]
description: All heaters off (heatsink fans keep running until below 50 C)
gcode:
    TURN_OFF_HEATERS
